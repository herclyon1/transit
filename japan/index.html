<!--
  「地図・学習」唯一入口。区域是切换器，不是不同页面——
  一个地图实例、一套渲染器、一份字形，切区域不重新加载页面。
  数据全部来自 OSM 原始数据：
    現代日本 47 都道府県（ISO3166-2 的 JP-01..47 直接对上 JIS 代码）+ 1741 市町村
    東亜 621 单元 / 27 国
    争议与分歧范围：填色按实际管理，官方划法另出虚线标注
  本页目前只做浏览。答题/闯关按计划在地图验收通过后重做。
-->
<link href="../vendor/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="../ui/hig.css">
<style>
  /* 界面照地图 App（HIG Maps / Sheets / Segmented controls）：地图全屏；顶部玻璃返回钮 + 玻璃分段控件切区域；
     底部非模态 Sheet：选中的详情、底图、图层开关、凡例；宽屏变左侧栏（Mac = Utility Panel 280）。控件一律用 ../ui/hig.css 的 Kit 类
     （KIT-MAP.md），这里只写位置/布局和「内容」（图例色块）。尺寸出处见 ../DESIGN-HIG.md、hig-kit/NUMBERS.md。 */
  html,body{overflow:hidden}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:.6471em}
  .maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom) + 100px)}
  @media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0}}
  .bar .seg{flex:0 1 260px}   /* 高度/内边/标签字号按 hig.css 的 Kit 工具条分段（Large 48 段 44、标签 13.33 Medium） */
  #card{display:none}
  #card.on{display:block}
  /* 底图分段控件（Kit Segmented Controls › Small 32 / Mac Regular 24 r6）的位置：和同列的 .mcard 一样内缩（布局边距；Mac 14），占满 */
  .segrow{padding:0 var(--inset)}
  .segrow .seg{display:flex}
  @media (min-width:900px) and (pointer:fine){ .segrow{padding:0 14px} }
  /* 凡例容器：里面第一个段头是 :first-child（hig.css 给首段头的上距 10 / Mac 2），补回组间距（30 / Mac 16）的差 */
  #lgSect{padding-top:20px}
  @media (min-width:900px) and (pointer:fine){ #lgSect{padding-top:14px} }
  /* 图例色块 = 内容（kit-audit「内容」），不是控件：10 方块 r2，行文字前 8 */
  .tsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px;flex:none}
  .tsw.dash{width:14px;height:0;border-radius:0;background:none;border-top:2px dashed currentColor;vertical-align:3px}
  /* 卡片里的争议说明（.txt 是 hig.css 卡片文字块）用红色 */
  .mcard .txt.disp{color:var(--red)}
  .hidden-ctl{display:none}
</style></head><body>

</div>

    <span class="slot"><button class="btn-glass fill" id="cClose" aria-label="关闭详情" hidden><i class="sf" data-sf="xmark"></i></button></span></div>
  <div class="body">
    <!-- 点中的单元 = Kit Lists › Grouped Table View（Mac Group Box + Forms 行）：一张卡（名称行 .hdr + 属性行 .r）+ 人口・面积卡（三行 .r）+ Footer 来源 -->
    <div id="cardSect" hidden><div id="card"></div></div>
    <!-- 底图 = Kit Segmented Controls › Small 32（Mac Regular 24 r6）：なし / 地図 / 写真 / 標高（地理院タイル；KIT-MAP：缩略图块 .tiles → .seg） -->
    <h2 class="mh">底图</h2>
    <div class="segrow"><div class="seg" id="baseSeg" role="group" aria-label="底图">
      <button data-b="none" aria-pressed="true">なし</button><button data-b="pale" aria-pressed="false">地図</button><button data-b="photo" aria-pressed="false">写真</button><button data-b="relief" aria-pressed="false">標高</button>
    </div></div>
    <h2 class="mh">图层</h2>
    <div class="mcard" id="tools">
      <label class="r"><span class="k">交通</span><span class="sw"><input type="checkbox" id="b-tr"><i></i></span></label>

      <label class="r"><span class="k">空港</span><span class="sw"><input type="checkbox" id="b-air"><i></i></span></label>
      <label class="r"><span class="k">海域・远岛</span><span class="sw"><input type="checkbox" id="b-sea" checked><i></i></span></label>
    </div>
    <!-- 各开关的说明 = Kit Lists › Footer（行里不再放副题：Mac Forms 行带开关的是 48，两行制是 56，说明文字放段脚） -->
    <div class="mfoot">交通：鉄道・空港・港湾・口岸・航路。港湾・空港：国土数値情報の港湾データ・空港データ、種別で色分け。海域・远岛：領海・EEZ 近似线，沖ノ鳥島・南鳥島・尖閣・竹島等。</div>
    <!-- 凡例 = 每类一组：段头 .mh + .mcard 里一行一个色块（drawLegend 生成） -->

<script>
const REGIONS=["北海道","東北","関東","中部","近畿","中国","四国","九州・沖縄"];
const RC=["#8FB8D8","#9BC4A6","#E2A07E","#E8C97C","#D4899B","#A9A7D6","#8FCBC4","#E0956E"];
const RUS="#6E8CCF";   // ロシア：国家代表色 blue（Wikipedia National colours）
// ★ 用户定的规则：東亜各国的填色按**各国的代表色**。
//   色源取自**外部权威来源**：Wikipedia「National colours」——各国自己声明的国家代表色
//   （多数有法源或奥委会/体育协会依据）。条目里没有的 4 个太平洋国家/地区退回国旗主色。
//   25 国里 13 个自报「红」，所以还要一条让步规则：**冲突时国土面积小的一方**
//   先换明度、再退到它自己声明的**第二色**——这样在地图上占最大面积的国家保住第一代表色
//   （中国 = 红）。生成器 pipeline/mkpal2.py，色源解析 pipeline/natcol.py。
//   改完必须跑 pipeline/check_palette.py：52 对接壤（含隔海相望）ΔE(CIE76) 全 ≥15。
const EAC=[
 "CHN","#CF6E6E",  // 中国：国家代表色 red
 "JPN","#D69AA7",  // 日本：国家代表色 red
 "KOR","#4573C9",  // 韓国：国家代表色 red
 "PRK","#8EA2C7",  // 朝鮮：国家代表色 red
 "MNG","#6EA5CF",  // モンゴル：国家代表色 blue
 "TWN","#6B88BD",  // 台湾：国家代表色 blue
 "VNM","#CFCF6E",  // ベトナム：国家代表色 yellow
 "LAO","#C94554",  // ラオス：国家代表色 red
 "KHM","#9AAFD6",  // カンボジア：国家代表色 red
 "THA","#CF6E7E",  // タイ：国家代表色 red
 "MMR","#CFBB6E",  // ミャンマー：国家代表色 yellow
 "MYS","#C9AF45",  // マレーシア：国家代表色 gold
 "SGP","#CF6E76",  // シンガポール：国家代表色 red
 "BRN","#D6CF9A",  // ブルネイ：国家代表色 yellow
 "IDN","#C94545",  // インドネシア：国家代表色 red
 "TLS","#D69E9A",  // 東ティモール：国家代表色 red
 "PNG","#D69AA1",  // パプアニューギニア：国家代表色 red
 "PHL","#BBC6DD",  // フィリピン：国家代表色 blue
 "IND","#CF8D6E",  // インド：国家代表色 saffron
 "LKA","#9AABD6",  // スリランカ：国家代表色 blue
 "NPL","#C94562",  // ネパール：国家代表色 crimson
 "BTN","#D6AE9A",  // ブータン：国家代表色 orange
 "BGD","#CF6E79",  // バングラデシュ：国家代表色 red
 "PLW","#D6D69A",  // パラオ：条目に記載なし → 国旗主色
 "FSM","#6EA8CF",  // ミクロネシア：条目に記載なし → 国旗主色
 "MHL","#6B86BD",  // マーシャル：条目に記載なし → 国旗主色
 "MNP","#4571C9",  // 北マリアナ：条目に記載なし → 国旗主色
 "MDV","#C9455E",  // モルディブ：国家代表色 red
];

// 港湾・空港的种别 → 颜色（README 说颜色由页面定）：港湾按港湾法的种别从深到浅（国際戦略 → その他），空港按空港法的种别从深到浅、
// 共用空港（自衛隊・米軍と共用）用褐色，和東亜图例里的军用色一路；两组和交通图例的「空港 #5B4B8A」「航路 #3E7CB1」都分得开。
const PORT_KINDS=[["国際戦略港湾","#0B3D5C"],["国際拠点港湾","#1F6F8B"],["重要港湾","#4F9BB8"],["地方港湾","#8EC3D6"],["その他","#C2D6DF"]];
const AIR_KINDS=[["拠点空港（会社管理）","#3B2E5A"],["拠点空港（国管理）","#5B4B8A"],["拠点空港（特定地方管理）","#7A6AA8"],["地方管理空港","#9A8FC0"],["共用空港","#7A6A55"],["その他","#BDB5CF"]];

// 市区町村码 → 名。町丁那一级的「市町村」必须从**町丁自己带的 e-Stat 码**读，
// 不能拿 OSM 的市界去命中——两份数据在飞地和市界上有 607 处分歧（全量比对过），
// 用户点大阪府泉佐野市的飞地「大口新田」被标成泉南市就是这么来的。
let MUNI_NAMES={};
fetch("data/muni_names.json").then(r=>r.json()).then(j=>{MUNI_NAMES=j;MUNI_CODES=buildRev(j);}).catch(()=>{});
// 反查：pref|市町村名 → 该市町村名下的所有 CITY 码（政令市有多个区码）
let MUNI_CODES={};
const buildRev=j=>{const r={};
  for(const code in j){const pref=+code.slice(0,2), city=code.slice(2);
    const k=pref+"|"+j[code]; (r[k]=r[k]||[]).push([pref,city]);}
  return r;};
const muniOf=p=>{
  if(!p||p.pref==null||p.city==null) return null;
  const code=String(p.pref).padStart(2,"0")+String(p.city).padStart(3,"0");
  return MUNI_NAMES[code]||null;
};
// 人口・面積・人口密度：令和7年国勢調査 人口速報集計（data/README-pref-stats.md）。県按 2 位码，市区町村按 5 位团体码（町丁带的 pref+city 就是它）；
// 没有町丁（z<11）时按「県码|名」反查（政令市の区 = 市名+区名，如 大阪市北区）。查不到 → 三行都显示「—」。
let PREF_STATS={}, MUNI_STATS={}, MUNI_STATS_BY_NAME={}, statsReady=0;   // statsReady=2 两份都到了；没到之前查不到不算「表里没有」
fetch("data/pref_stats.json").then(r=>r.json()).then(j=>{ (j.prefs||[]).forEach(x=>{ PREF_STATS[x.code]=x; }); statsReady++; }).catch(()=>{});
fetch("data/muni_stats.json").then(r=>r.json()).then(j=>{ MUNI_STATS=j.munis||{}; for(const c in MUNI_STATS) MUNI_STATS_BY_NAME[c.slice(0,2)+"|"+MUNI_STATS[c].name]=MUNI_STATS[c]; statsReady++; }).catch(()=>{});
function statsFor(prefCode, ch, ku, mu, prefName){
  const pp=String(prefCode).padStart(2,"0");
  if(ch&&ch.properties&&ch.properties.city!=null){ const m=MUNI_STATS[pp+String(ch.properties.city).padStart(3,"0")]; if(m) return {st:m,label:m.name}; }
  if(ku&&ku.properties&&ku.properties.n){ const nm=(ku.properties.shi||"")+ku.properties.n; return {st:MUNI_STATS_BY_NAME[pp+"|"+nm]||null,label:nm}; }
  if(mu&&mu.properties&&mu.properties.n){ return {st:MUNI_STATS_BY_NAME[pp+"|"+mu.properties.n]||null,label:mu.properties.n}; }
  const p=PREF_STATS[pp]; return {st:p||null,label:(p&&p.name)||prefName||"—"};
}

// GitHub Pages 的 CDN（Fastly）对首次未缓存的对象会无视 Range 回 200 整文件（jp.pmtiles、ea_lakes 都撞过：桌面 Chrome 首访
// 整张日本图空白，pmtiles.js 报「Server returned no content-length header… HTTP Byte Serving」；刷新后 206 正常，Safari 没复现）。
// 包一层：抛这个错就等 500 ms 重发一次（第二次命中 CDN 缓存就是 206），连续两次 200 才真报错。（maa 会话 2026-09-15 发现）
{ const orig=pmtiles.FetchSource.prototype.getBytes;
  pmtiles.FetchSource.prototype.getBytes=async function(off,len,signal,etag){
    try{ return await orig.call(this,off,len,signal,etag); }
    catch(e){ if(!/Byte Serving/.test((e&&e.message)||'')||(signal&&signal.aborted)) throw e;
      await new Promise(r=>setTimeout(r,500));
      return orig.call(this,off,len,signal,etag); } }; }
const proto=new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles",proto.tile);
// 瓦片和字形统一放在仓库根的 tiles/，页面在子目录里，所以按页面 URL 解析成绝对路径
const TB=new URL("../tiles/",document.baseURI).href;
// 瓦片版本号。**重切瓦片后必须改这里**：
// pmtiles 是按字节范围取的，浏览器/CDN 把旧文件的某段范围缓存住之后，
// 新文件同名同 URL，目录偏移全对不上，取回来的就是垃圾——表现为
// 「标注还在、边界整片消失」，而且不报错。GitHub Pages 的 max-age 是 600s，
// 手机上实测能吃到更久。加个查询串就当成新资源，一次性根治。
const V="?v=20260810u";
const prefColor=["match",["get","reg"]]; REGIONS.forEach((_,i)=>prefColor.push(i,RC[i])); prefColor.push("#CCC");

// 壳（ui/shell.js）：地图 + Sheet 由壳建；这页的点击要跨图层命中测试，所以走 click(e) 而不是 layers() 的按图层表；详情卡片是 Sheet 里的内联卡（地图 App 的「这是哪」提示），不叠放
// 署名（MapLibre 折叠 ⓘ；Mac = Kit Toolbar Medium 24，hig.css A25）：OSM（ODbL）+ 国土数値情報 利用約款要求的出典句 + e-Stat 出典
const ATTR='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · '
  +'<a href="https://nlftp.mlit.go.jp/ksj/">国土数値情報</a>（港湾データ・空港データ）（国土交通省）を加工して作成 · '
  +'<a href="https://www.e-stat.go.jp/stat-search/files?page=1&layout=datalist&lid=000001482693">令和7年国勢調査 人口速報集計</a>（総務省統計局）';
const APP=HIGShell.create({initial:"small", click:e=>onMapClick(e), attribution:ATTR, map:{maxZoom:15,
  style:{version:8,
    // CJK 字形：只生成标注实际用到的码位区段，不是整套中日文字库（整套要上百 MB）。
    // 09-16 核对：目录里 256 个区段共 16,077 字，港湾・空港名用到的 586 字全在（pipeline 重切字形时再核一次）。
    glyphs:TB+"glyphs/{fontstack}/{range}.pbf",
    sources:{
      jp :{type:"vector",url:"pmtiles://"+TB+"jp.pmtiles"+V},
      // 海域范围（EEZ 近似线）+ 远岛高精度海岸线（沖ノ鳥島/南鳥島/尖閣/竹島/硫黄/大東/小笠原，OSM 实测），从旧クイズ搬来（09-15 审查 #54）
      sea:{type:"geojson",data:"data/sea_islands.geojson"},
      // 町丁・字等按地方拆成 4 份：整份 z14 有 225MB，超 GitHub 单文件 100MB 上限。
      // 拆开后每份 30~71MB，且不必牺牲最高层级的细节。视口只会取用到的那一份。
      choA:{type:"vector",url:"pmtiles://"+TB+"ka_a.pmtiles"+V},
      choB:{type:"vector",url:"pmtiles://"+TB+"ka_b.pmtiles"+V},
      choC:{type:"vector",url:"pmtiles://"+TB+"ka_c.pmtiles"+V},
      choD:{type:"vector",url:"pmtiles://"+TB+"ka_d.pmtiles"+V},
      // 町丁名的标注点单独一份：23 万个点，塞回 ka_* 要重切 615MB 的面数据，
      // 单独切只要 21MB，而且面数据一个字节都不用动。
      chol:{type:"vector",url:"pmtiles://"+TB+"cholab.pmtiles"+V},
      ea :{type:"vector",url:"pmtiles://"+TB+"ea_units.pmtiles"+V},
      // 底图：国土地理院タイル（官方、允许引用，日本境内覆盖最好）。
      // 只在需要时才挂上——不挂就一个瓦片都不请求。
      gsi_pale :{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"],
                 tileSize:256,maxzoom:18,attribution:"地理院タイル"},
      gsi_photo:{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"],
                 tileSize:256,maxzoom:18,attribution:"地理院タイル"},
      gsi_relief:{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png"],
                 tileSize:256,maxzoom:15,attribution:"地理院タイル"},
      // 公共交通：国土数値情報（国土交通省）N02-24 鉄道 / C28-21 空港 / N09-12 定期旅客航路
      tr :{type:"vector",url:"pmtiles://"+TB+"transit.pmtiles"+V},
      // 港湾・空港の標点：国土数値情報 C02-14 港湾（994 点）/ C28-21 空港（97 点），kind 分色（data/README-ports-airports.md）
      ports   :{type:"geojson",data:"data/ports.geojson"},
      airports:{type:"geojson",data:"data/airports.geojson"},
      // 東亜交通：OSM（21 个国家/地区的 Geofabrik 提取包 + 俄远东）。
      // 日本境内**不用**这一份——N02 的分类（新幹線/JR/民鉄/三セク）比 OSM 稳，
      // 所以東亜视图里的日本仍旧走上面那个 tr 源，两份拼起来正好不重不漏。
      etr:{type:"vector",url:"pmtiles://"+TB+"eatr.pmtiles"+V,maxzoom:11},
      // 高速/一級公路单独一个文件：并进 eatr.pmtiles 的话是 101.3MB，
      // 正好压在 GitHub 单文件 100MB 上限上，拆开之后 31MB + 71MB。
      erd:{type:"vector",url:"pmtiles://"+TB+"eatr_road.pmtiles"+V,maxzoom:11},
      // 一级行政区名在 z7 以上改成**按视口动态生成**（见 updateDynLabels）：
      // 瓦片里每个单元只有一个标注点、钉在首府上，一放大首府出了屏幕就一个名字都没有。

      {id:"tr-air-lab",source:"tr","source-layer":"airlab",type:"symbol",minzoom:6,layout:{visibility:"none",

    ?["interpolate",["linear"],["zoom"],4,.6,10,1.8]
    :["interpolate",["linear"],["zoom"],2,.4,10,.9]);

// 一级行政区名（z7 以上）：按视口动态生成，屏幕上有几个省就写几个名字，各写一次。
// 做法：在屏幕上撒 5×9 个采样点，逐点问「这里是哪个单元」，
// 同一个单元的采样点归成一堆，取离堆中心最近的那个点当标注位置
// （取平均值可能落到该省之外，取最近的采样点必定在省内）。
// 采样只查已经画出来的图层，不额外读数据，一次 45 次命中测试，手机上无感。
let dynKey = "";   // 上次写进 dyn 源的内容签名：一样就不再 setData，否则 setData→重绘→idle→setData 永不停（09-15 审查 #39）
function updateDynLabels(){
  const src = map.getSource("dyn");
  if(!src) return;
  if(region!=="ea" || map.getZoom()<7){ if(dynKey!==""){ dynKey=""; src.setData({type:"FeatureCollection",features:[]}); } return; }
  const cv = map.getCanvas(), w = cv.clientWidth, h = cv.clientHeight;
  const NX=5, NY=9, acc={};
  const layers = ["ea-fill","jp-fill"].filter(l=>map.getLayer(l));
  for(let i=0;i<NX;i++) for(let j=0;j<NY;j++){
    const q=[(i+0.5)*w/NX,(j+0.5)*h/NY];
    let f=null;
    try{ f = map.queryRenderedFeatures(q,{layers})[0]; }catch(e){}
    const n = f && f.properties && f.properties.n;
    if(!n) continue;
    (acc[n]=acc[n]||[]).push(q);
  }
  const features = Object.keys(acc).map(n=>{
    const ps=acc[n];
    const cx=ps.reduce((a,b)=>a+b[0],0)/ps.length, cy=ps.reduce((a,b)=>a+b[1],0)/ps.length;
    let best=ps[0], bd=Infinity;
    for(const q of ps){ const d=(q[0]-cx)*(q[0]-cx)+(q[1]-cy)*(q[1]-cy); if(d<bd){bd=d;best=q;} }
    const ll=map.unproject(best);
    return {type:"Feature",properties:{n},geometry:{type:"Point",coordinates:[ll.lng,ll.lat]}};
  });
  const key = features.map(f=>f.properties.n+"@"+f.geometry.coordinates.map(v=>v.toFixed(3)).join(",")).join("|");
  if(key===dynKey) return;
  dynKey = key; src.setData({type:"FeatureCollection",features});
}
map.on("moveend", updateDynLabels);
map.on("idle", updateDynLabels);

  h += region==="jp"
    ? group("地方", REGIONS.map((x,i)=>[RC[i],x]).concat([[RUS,"北方領土（ロシア実効支配）"]]))
    : group("凡例", [["#8a3f3f","虚线＝官方划法与实控不同",true]]);
  el.innerHTML=h;
}
let legOpen=false;
function setLegend(on){
  legOpen=on;
  if(on){ drawLegend(); }
}
document.getElementById("b-leg").onclick=()=>setLegend(!legOpen);

// 底部那条（提示 or 详情）高度会变，图例的底边跟着它顶上去，别写死像素
function fitLegend(){}
document.getElementById("cClose").addEventListener("click",()=>{ clearSelection(); closeCard(); });
function closeCard(){ const c=document.getElementById("card"); c.style.display="none"; c.classList.remove("on"); c.innerHTML=""; document.getElementById("cardSect").hidden=true; document.body.classList.remove("carded");
  document.getElementById("hint").style.display=""; document.getElementById("cClose").hidden=true; if(SHEET.get()!=="large") SHEET.set("small"); }
// 清掉地图上所有选中描边（两个视图的都清，切视图/点空白/关卡片共用，#43）
function clearSelection(){
  const none=["==",["get","n"],"\u0000"];
  ["jp-selm","jp-selk","jp-selmA","jp-selmB","jp-selmC","jp-selmD","jp-selcA","jp-selcB","jp-selcC","jp-selcD","ea-sel","ea-sub-sel","ea-rus-sel"].forEach(id=>{ if(map.getLayer(id)) map.setFilter(id,none); });
  if(map.getLayer("jp-sel")) map.setFilter("jp-sel",["==",["get","code"],-1]);
  if(map.getLayer("jp-disp-sel")) map.setFilter("jp-disp-sel",["==",["get","dn"],"\u0000"]);
}


document.getElementById("b-jp").onclick=()=>setRegion("jp");
document.getElementById("b-ea").onclick=()=>setRegion("ea");

// 初始化不等 load：只要有一个来源取不到（CDN 抽风、本地服务器掉连接），MapLibre 的 map.loaded() 永远是 false、load 永远不发，
// 于是区域/图例/开关全没初始化（本会话 09-16 用 Network.setBlockedURLs 挡掉 ea_lakes 复现）。样式一装好（style.load）图层就都在，
// 这里要做的只是改 layout/filter 和画图例，不需要瓦片；load 留作兜底。
let inited=false;
const init=()=>{ if(inited) return; inited=true; setRegion("jp"); setLegend(true); };
map.on("style.load",init); map.on("load",init);

const CN_NAME={CHN:"中国",JPN:"日本",KOR:"韩国",PRK:"朝鲜",MNG:"蒙古",TWN:"台湾",HKG:"香港",MAC:"澳门",VNM:"越南",LAO:"老挝",KHM:"柬埔寨",THA:"泰国",MMR:"缅甸",MYS:"马来西亚",SGP:"新加坡",IDN:"印度尼西亚",PHL:"菲律宾",BRN:"文莱",TLS:"东帝汶",IND:"印度",NPL:"尼泊尔",BTN:"不丹",BGD:"孟加拉国",LKA:"斯里兰卡",RUS:"俄罗斯",KAZ:"哈萨克斯坦",KGZ:"吉尔吉斯斯坦",TJK:"塔吉克斯坦",AFG:"阿富汗",PAK:"巴基斯坦"};
// 卡片 = Kit 列表：.hdr（24 图标 + 名称）+ 属性行 .r（k 左 / v 右，副题 .hint）；人口・面積卡三行 + Footer 出典
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row=(k,v,hint,cls)=>`<div class="r"><span class="k">${esc(k)}${hint?`<div class="hint">${esc(hint)}</div>`:""}</span>${v!=null?`<span class="v${cls?" "+cls:""}">${esc(v)}</span>`:""}</div>`;
const hdr=(name,icon)=>`<div class="hdr"><span class="ico"><i class="sf" data-sf="${icon||"mappin"}"></i></span><span>${esc(name)}</span></div>`;
const card1=(name,rows,icon,note)=>`<div class="mcard">${hdr(name,icon)}${rows}${note?`<div class="txt disp">${esc(note)}</div>`:""}</div>`;
const fmtN=(n,unit)=>n==null?null:Number(n).toLocaleString("ja-JP")+(unit?" "+unit:"");
function statsCard(r){   // r = statsFor(...) → {st, label}；查不到的值显示「—」
  const st=r&&r.st, v=(n,u)=>{ const t=fmtN(st?st[n]:null,u); return t==null?["—","none"]:[t,""]; };
  const rows=[["人口",...v("pop","人")],["面積",...v("area_km2","km²")],["人口密度",...v("density","人/km²")]].map(([k,t,c])=>row(k,t,null,c)).join("");
  return `<div class="mcard">${hdr((r&&r.label?r.label+" · ":"")+"人口・面積","chart.bar")}${rows}</div>`
    +`<div class="mfoot">令和7年国勢調査 人口速報集計（総務省統計局、2025年10月1日現在）。面積は同表の参考値（国土地理院 面積調）。${st?"":(statsReady>=2?"この単位は速報表に載っていない。":"読み込み中：もう一度点すると出る。")}</div>`;
}
function showCard(html){
  const c=document.getElementById("card"); c.innerHTML=html; c.style.display="block"; c.classList.add("on");
  document.getElementById("cardSect").hidden=false; document.body.classList.add("carded");
  document.getElementById("hint").style.display="none"; document.getElementById("cClose").hidden=false; HIG.sf();
  if(SHEET.get()==="small") SHEET.set("medium");
}
// 港湾・空港的点击：开着才查，手指 22px / 鼠标 12px 容差。返回 {rows: 加进行政单元卡片的行, cards: 点在海上没命中陆地时单独出的卡}
function ptHits(e){
  const out={rows:"",cards:""}; if(!(portOn||airOn)) return out;
  const R=matchMedia("(pointer: coarse)").matches?11:6, bb=[[e.point.x-R,e.point.y-R],[e.point.x+R,e.point.y+R]];
  const add=(lab,f,icon)=>{ const q=f.properties, kind=q.kind+(q.status&&q.status!=="供用中"?"・"+q.status:"");
    out.rows+=row(lab,q.name,kind); out.cards+=card1(q.name, row("種別",q.kind)+(q.status&&q.status!=="供用中"?row("供用",q.status):"")+row("都道府県",q.pref||"—"), icon); };
  if(portOn){ const f=map.queryRenderedFeatures(bb,{layers:["pt-port"]})[0]; if(f&&f.properties) add("港湾",f,"mappin"); }
  if(airOn){ const f=map.queryRenderedFeatures(bb,{layers:["pt-air"]})[0]; if(f&&f.properties) add("空港",f,"mappin"); }
  return out;
}
function onMapClick(e){
  const fillId=region==="jp"?"jp-fill":"ea-fill";
  const selId =region==="jp"?"jp-sel" :"ea-sel";
  const dispId=region==="jp"?"jp-disp-fill":"ea-disp-fill";   // 命中打填充层，不打虚线（#42）
  // 東亜视图里日本是用現代日本那份几何补上的，命中层不一样，得一起查。
  // 北方領土画在单独的 disp 层里，不在任何一个 fill 层里——原来没挂进命中层，
  // 于是点它完全没反馈（用户报的 bug）。两个视图各自的 disp 填充层都要挂上。
  const hitLayers = region==="jp" ? [fillId,"jp-disp-fill"]
                                  : [fillId,"jp-fill","ea-rus","jp-disp-fill"];
  // 東亜下一级（越南的社/坊、缅甸的県）：单独查，查到就在卡片上多写一行
  const sub = region==="ea" && map.getLayer("ea-sub-fill")
    ? map.queryRenderedFeatures(e.point,{layers:["ea-sub-fill"]})[0] : null;
  if(map.getLayer("ea-sub-sel"))
    map.setFilter("ea-sub-sel", sub?["all",["==",["get","n"],sub.properties.n],["==",["get","up"],sub.properties.up]]:["==",["get","n"],"\u0000"]);   // 同名的社/坊跨省不一起亮（#41）
  // 远岛：岛体只有几像素，先用带容差的方框查（#54）
  if(region==="jp" && map.getLayer("jp-isl-fill") && seaOn){ const R=matchMedia("(pointer: coarse)").matches?12:6;
    const isl=map.queryRenderedFeatures([[e.point.x-R,e.point.y-R],[e.point.x+R,e.point.y+R]],{layers:["jp-isl-fill"]})[0];
    if(isl){ clearSelection(); showCard(card1(isl.properties.n, row("所属",isl.properties.own||"—"))); return; } }
  const pt=ptHits(e), pts=pt.rows;
  const hit=map.queryRenderedFeatures(e.point,{layers:hitLayers})[0];
  if(!hit){ clearSelection(); if(pt.cards){ showCard(pt.cards); } else closeCard(); return; }   // 点空白：所有高亮（含北方領土/俄方实控区）和卡片、关闭钮一起收（#43 #44）；点在海上的港湾/空港标点则单独出一张卡
  const p=hit.properties, d=map.queryRenderedFeatures(e.point,{layers:[dispId]})[0];
  if(map.getLayer("ea-rus-sel")) map.setFilter("ea-rus-sel",["==",["get","n"],"\u0000"]);
  if(map.getLayer("jp-disp-sel")) map.setFilter("jp-disp-sel",["==",["get","dn"],"\u0000"]);
  let html, stats=null;
  if(p.dn){
    // 北方領土。填色按实际管理走（俄罗斯），卡片两边立场都写上。
    map.setFilter(selId, region==="jp"?["==",["get","code"],-1]:["==",["get","n"],"\u0000"]);
    if(region==="jp") ["jp-selm","jp-selk","jp-selmA","jp-selmB","jp-selmC","jp-selmD","jp-selcA","jp-selcB","jp-selcC","jp-selcD"].forEach(id=>map.setFilter(id,["==",["get","n"],"\u0000"]));
    else map.setFilter("jp-sel",["==",["get","code"],-1]);
    map.setFilter("jp-disp-sel",["==",["get","dn"],p.dn]);
    html=card1(p.dn, row("実効支配","ロシア連邦 サハリン州")+pts, "mappin", p.note||null);
  }else if(region==="jp"){
    map.setFilter(selId,["==",["get","code"],p.code]);
    // 命中测试一律打填充层。之前这里打的是 jp-muni（线层），
    // 只有正好点在边界线上才返回要素，所以市町村那一级几乎永远点不出来。
    const mu=map.queryRenderedFeatures(e.point,{layers:["jp-muni-fill"]})[0];
    const ku=map.queryRenderedFeatures(e.point,{layers:["jp-ku-fill"]})[0];
    const ch=map.queryRenderedFeatures(e.point,{layers:["jp-cho-fillA","jp-cho-fillB","jp-cho-fillC","jp-cho-fillD"]})[0];
    // 高亮跟着当前能看到的最细一级走，而不是永远框住整个県
    const muName = (ch&&muniOf(ch.properties)) || (mu&&mu.properties&&mu.properties.n) || null;
    // 町丁选中：只按名字过滤会把**全国同名的町丁**全点亮（用户截图里「新家」亮了三处）。
    // 必须连 pref+city 一起比。同一个市町村里同名的町丁本来就可能不连续
    //（e-Stat 按调查区切），那种是真的，应该一起亮。
    const chName = (ch&&ch.properties&&ch.properties.n) ? ch.properties.n : "\u0000";
    const chPref = ch&&ch.properties ? ch.properties.pref : null;
    const chCity = ch&&ch.properties ? ch.properties.city : null;
    const chFilter = chName==="\u0000" ? ["==",["get","n"],"\u0000"]
      : ["all",["==",["get","n"],chName],["==",["get","pref"],chPref],["==",["get","city"],chCity]];
    ["jp-selcA","jp-selcB","jp-selcC","jp-selcD"].forEach(id=>map.setFilter(id,chFilter));
    map.setFilter("jp-selk", ku ? ["all",["==",["get","n"],ku.properties.n],["==",["get","shi"],ku.properties.shi],["==",["get","pref"],ku.properties.pref]] : ["==",["get","n"],"\u0000"]);   // 只亮这一个市的这个区，不亮全国同名区（#40）
    // 市町村的高亮：**用町丁自己的码去圈**，而不是拿 OSM 的市界描边。
    // 两份数据在 607 处不一致，OSM 的泉佐野市里根本不含飞地「大口新田」，
    // 拿它描边永远框不住——这不是显示 bug，是两层用了两个来源。
    // 按码集合给同一市町村的所有町丁铺一层底色，飞地自然就包进去了。
    const selPref = (ch&&ch.properties&&ch.properties.pref) != null ? ch.properties.pref
                  : (mu&&mu.properties&&mu.properties.pref);
    const codes = muName ? (MUNI_CODES[selPref+"|"+muName]||[]) : [];
    const muFilter = codes.length
      ? ["any",...codes.map(([pf,ct])=>["all",["==",["get","pref"],pf],["==",["get","city"],ct]])]
      : ["==",["get","n"],"\u0000"];
    ["jp-selmA","jp-selmB","jp-selmC","jp-selmD"].forEach(id=>map.setFilter(id,muFilter));
    // z<11 没有町丁时，退回用 OSM 市界描边
    map.setFilter("jp-selm", (muName && !ch)
      ? ["all",["==",["get","n"],muName],["==",["get","pref"],selPref]]
      : ["==",["get","n"],"\u0000"]);
    let rows=row("県庁",p.cap)+row("地方",p.regn);
    if(muName) rows+=row("市町村",muName);
    if(ku&&ku.properties&&ku.properties.n) rows+=row("行政区",ku.properties.n);
    if(ch&&ch.properties&&ch.properties.n){
      const cc=ch.properties;
      rows+=row("町丁",cc.n);
      if(cc.pop!=null&&cc.pop!=="") rows+=row("人口・世帯",`${Number(cc.pop).toLocaleString()} 人 ／ ${Number(cc.hh||0).toLocaleString()} 世帯`,"町丁、令和2年国勢調査");
      else rows+=row("人口・世帯","无数据","町丁、令和2年国勢調査","none");   // 0 人和没数据分开（#52）
    }
    if(transit){
      const R=matchMedia("(pointer: coarse)").matches?11:4, bb=[[e.point.x-R,e.point.y-R],[e.point.x+R,e.point.y+R]];   // 手指给 22px 容差，鼠标 8px（#46）
      const st=map.queryRenderedFeatures(bb,{layers:["tr-station"]})[0];
      if(st&&st.properties&&st.properties.n) rows+=row("駅",st.properties.n,st.properties.ln||null);
      const ap=map.queryRenderedFeatures(bb,{layers:["tr-air"]})[0];
      if(ap&&ap.properties&&ap.properties.n && !(airOn&&pts.includes(">"+esc(ap.properties.n)+"<"))) rows+=row("空港",ap.properties.n);   // 「空港」开着时同名的由 pt-air 那行（带种别）写，不写两遍
    }
    rows+=pts;
    const dd=map.queryRenderedFeatures(e.point,{layers:["jp-disp-fill"]})[0];
    html=card1(p.n, rows, "mappin", (dd&&dd.properties&&dd.properties.dn)?`${dd.properties.dn}：${dd.properties.note}`:null);
    stats=statsFor(p.code, ch, ku, mu, p.n);
  }else if(p.de_facto==="RUS"){
    map.setFilter(selId,["==",["get","n"],"\u0000"]);
    map.setFilter("jp-sel",["==",["get","code"],-1]);
    map.setFilter("ea-rus-sel",["==",["get","n"],p.n]);
    html=card1(p.n, row("実効支配","ロシア連邦 サハリン州")+row("州都","ユジノサハリンスク")+pts, "mappin", p.note||null);
  }else if(p.grp!==undefined){
    map.setFilter(selId,["==",["get","n"],p.n]);
    map.setFilter("jp-sel",["==",["get","code"],-1]);
    let rows=row("国・地域",CN_NAME[p.grp]||p.grp);   // ISO 代码换国家名（#45）
    if(p.cap) rows+=row("首府",p.cap);
    if(transit){   // 東亜交通层：駅/空港/港湾/口岸/航路 点得出名字（#47）
      const R=matchMedia("(pointer: coarse)").matches?11:4, bb=[[e.point.x-R,e.point.y-R],[e.point.x+R,e.point.y+R]];
      const ETR=[["etr-station","駅"],["etr-airpt","空港"],["etr-port","港湾"],["etr-bc","口岸"],["etr-ferry","航路"]];
      for(const [lid,lab] of ETR){ if(!map.getLayer(lid)) continue; const f=map.queryRenderedFeatures(bb,{layers:[lid]})[0];
        if(f&&f.properties&&(f.properties.n||f.properties.name)) rows+=row(lab,f.properties.n||f.properties.name,f.properties.ln||null); }
    }
    if(sub&&sub.properties&&sub.properties.n) rows+=row("下位区画",sub.properties.n);
    rows+=pts;
    html=card1(p.n, rows);
  }else{
    // 命中的是東亜视图里的日本（属性来自 pref 层，没有 grp）
    map.setFilter(selId,["==",["get","n"],"\u0000"]);
    map.setFilter("jp-sel",["==",["get","code"],p.code]);
    html=card1(p.n, row("国・地域","日本")+row("県庁",p.cap)+row("地方",p.regn)+pts);
    stats=statsFor(p.code, null, null, null, p.n);
  }
  if(!p.dn && d&&d.properties&&d.properties.note && !html.includes('class="txt disp"'))
    html=html.replace(/<\/div>$/,`<div class="txt disp">${esc(`${d.properties.dn}：${d.properties.note}`)}</div></div>`);
  if(stats) html+=statsCard(stats);
  showCard(html);
}
</script></body></html>
