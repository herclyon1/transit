<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Flat map — generated Apple style</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #f0ede6; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="../vendor/maplibre-gl.js"></script>
<script src="../vendor/pmtiles.js"></script>
<script>
// Preview page for map/style-flat-{light,dark}.json (generated by pipeline/basemap/styl/to_maplibre.py).
// Hash: #ll=34.69,135.50&spn=0.12,0.2 (MapKit-style region) or MapLibre's own #z/lat/lng. ?dark=1 forces dark.
(function () {
  maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);   // tiles/transit.pmtiles (N02 railways)
  const q = new URLSearchParams(location.search);
  const dark = q.get('dark') === '1' || (q.get('dark') !== '0' && matchMedia('(prefers-color-scheme: dark)').matches);
  const style = dark ? 'style-flat-dark.json' : 'style-flat-light.json';
  const m = location.hash.match(/ll=([-\d.]+),([-\d.]+)&spn=([-\d.]+),([-\d.]+)/);
  const map = new maplibregl.Map({ container: 'map', style: style + '?v=' + Date.now(), hash: !m, attributionControl: false,
                                   center: m ? [Number(m[2]), Number(m[1])] : [135.5, 34.69], zoom: 11 });
  map.on('load', () => {
    if (m) {
      const [lat, lng, dlat, dlng] = m.slice(1).map(Number);
      map.fitBounds([[lng - dlng / 2, lat - dlat / 2], [lng + dlng / 2, lat + dlat / 2]], { duration: 0, padding: 0 });
    }
    window.__mapReady = true;
  });
  map.on('idle', () => { window.__mapIdle = true; });
  window.__map = map;
})();
</script>
</body>
</html>
