<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>薪资 · 购买力</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2334c759'/><text x='32' y='44' font-size='36' font-weight='700' text-anchor='middle' fill='%23fff' font-family='-apple-system,sans-serif'>¥</text></svg>">
<link href="../vendor/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="../ui/hig.css">
<style>
@media (min-width:900px){#card .grab{display:none}}
#card.stacked{z-index:16}
/* 想法见 ../IDEAS.md 第 6 节；数据规范见 data/README.md。
   界面照地图 App：地图全屏；左上一个玻璃圆钮回目录、右上货币；底部一张非模态 Sheet——
   没选城市时是「搜索 + 城市列表」，点了城市就是那座城的卡片。宽屏时 Sheet 变成左侧 320 的侧栏。
   所有尺寸来自 ../ui/hig.css（DESIGN-HIG.md 有出处）。 */
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:.6471em}
.maplibregl-ctrl-bottom-right{bottom:calc(44dvh + 8px)}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0}}
/* 列表行右侧：数值 17 半粗 + 胶囊（股市行的形） */
.mrow .val{display:flex;align-items:center;gap:6px;flex:none;font-variant-numeric:tabular-nums}
.mrow .val b{font-weight:600;white-space:nowrap} .mrow .val b small{font-size:.7647em;font-weight:400;color:var(--ink-2)}
/* 卡片态：render() 输出的 section/h3/.r/.src/table 映射成地图 App 地点卡片（groups()） */
#card .mcard .r{align-items:baseline}
#card .mcard .r .k{color:var(--ink)}
#card .mcard .r .v{font-weight:600}
#card .mcard .r .v.none{font-weight:400}
#card .mcard .src + .r::before{content:none}
#card .mcard > .src:first-child{margin-top:0;padding-top:12px}
.mnote{margin:0;padding:10px var(--inset) 0;color:var(--ink-2);font-size:.7647em;line-height:1.3846em}
.mbtn{padding:16px var(--inset) 0}
.chip{display:inline-block;font-size:.6471em;line-height:1.1818em;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle;color:#fff;background:var(--ink-3);font-weight:600}
.chip.official{background:var(--green)} .chip.listing{background:var(--tint)} .chip.measured{background:var(--ink)}
.chip.crowd{background:var(--orange)} .chip.estimated{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.stale{color:var(--orange)}
.derived{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.derived .big{font-size:1.6471em;font-weight:700}
#card .mcard > div[style*="overflow-x"]{padding:0 16px 8px}
table.tiers{border-collapse:collapse;font-size:.7647em;line-height:1.3846em;width:100%}
table.tiers th{font-weight:600;color:var(--ink-2);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tiers td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.tiers tr:last-child td{border-bottom:0}
table.tiers td a{color:var(--ink);font-weight:600;text-decoration:none}
table.tiers .chip{width:6px;height:6px;padding:0;margin-left:4px;vertical-align:middle}
table.tiers .chip.crowd,table.tiers .chip.estimated{width:6px;height:6px;box-shadow:none;background:var(--ink-3)}
#card .links a{display:flex;align-items:center;justify-content:space-between;min-height:47px;padding:12.5px 16px;color:var(--ink);text-decoration:none;position:relative}
#card .links a + a::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
#card .links a::after{content:"›";color:var(--ink-3);margin-left:8px}
</style>
</head>
<body>
<div class="map-shell">
  <div id="map" class="map"></div>
</div>
<div class="bar">
  <a class="btn-glass glass" href="../index.html" aria-label="返回目录"><i class="sf" data-sf="chevron.left"></i></a>
  <span class="spacer"></span>
  <button class="btn-glass glass text cur" id="curBtn" type="button" aria-label="货币"><span id="curLabel">当地</span><i class="sf" data-sf="chevron.down" style="width:.8em;height:.8em"></i></button>
</div>
<aside class="sheet glass split" id="sheet" aria-label="城市">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div id="list">
    <div class="head"><label class="search" style="flex:1 1 auto"><i class="sf" data-sf="magnifyingglass"></i><input id="q" type="search" placeholder="搜索城市" autocomplete="off"><button class="clear" type="button" aria-label="清除"><i class="sf" data-sf="xmark.circle.fill"></i></button></label></div>
    <div class="body">
      <!-- 地图 App 首页的「建议卡」：说明这张图是什么，× 掉就记住 -->
      <div class="sugg" id="intro"><span class="ico"><i class="sf" data-sf="yensign"></i></span><div><div class="t">薪资 · 购买力</div><div class="s">时薪、房租、通勤、生活费，换算成每月要打的工时。</div></div><button class="x" type="button" aria-label="关闭" id="introX"><i class="sf" data-sf="xmark"></i></button><button class="a" type="button" id="introMore">数据规范</button></div>
      <h2 class="mh">城市 <i class="sf" data-sf="chevron.right"></i></h2>
      <div class="mlist" id="cityRows"></div>
      <p class="mnote">工时 = 到枢纽 15 分那档的月开销 ÷ 有效岗位时薪中位数　<span id="curDate"></span></p>
    </div>
  </div>
  <div id="card" hidden>
    <div class="grab"><i></i></div>
    <div class="head"><span class="slot"></span><div class="tt"><div class="t-title2" id="cName"></div><div class="t-sub dim" id="cMeta"></div></div><span class="slot"><button class="btn-glass fill" id="cClose" aria-label="关闭"><i class="sf" data-sf="xmark"></i></button></span></div>
    <div class="body" id="cBody"></div>
  </div>
</aside>
<!-- 货币：UIMenu 式下拉菜单（hig-kit NUMBERS.md），不用 <select> -->
<div class="menu" id="curMenu" hidden role="menu" aria-label="货币"><button role="menuitemradio" aria-checked="true" data-value="local"><i class="sf" data-sf="checkmark"></i>当地</button></div>

<script src="../ui/sheet.js"></script>
<script src="../ui/press.js"></script>
<script src="../ui/hig.js"></script>
<script src="../vendor/maplibre-gl.js"></script>
<script src="../ui/shell.js"></script>
<script>
const $=id=>document.getElementById(id);
// 城市清单很小，先取到再建图：点直接内嵌进样式的 source，不用等 load 事件
let CITIES=[], RATES=null, CUR='local', map=null, APP=null;
(async()=>{
try{ CITIES=await (await fetch('data/cities.json')).json(); }catch(e){ CITIES=[]; }
// 壳（ui/shell.js）：地图 + Sheet + 叠放卡片 + 点击→卡片；这页只给 layers() 和 card()
APP=HIGShell.create({
  attribution:'Natural Earth（公有领域）',
  map:{center:[120,25],zoom:2.2,minZoom:1,maxZoom:9,
  style:{version:8,
    // 字形沿用仓库里那套 NotoSansJP 全 256 段
    // 花括号不能进 new URL（会被转义成 %7B），先解析目录再拼模板
    glyphs:new URL('../tiles/glyphs/',document.baseURI).href+'{fontstack}/{range}.pbf',
    sources:{
      c110:{type:'geojson',data:new URL('data/countries_110m.geojson',document.baseURI).href},
      c50 :{type:'geojson',data:new URL('data/countries_50m.geojson',document.baseURI).href},
      cities:{type:'geojson',data:{type:'FeatureCollection',features:CITIES.map(c=>({type:'Feature',
        properties:{id:c.id,label:c.name.zh,status:c.status},geometry:{type:'Point',coordinates:[c.lon,c.lat]}}))}}},
    layers:[
      {id:'bg',type:'background',paint:{'background-color':'#DCEBF5'}},
      {id:'land110',type:'fill',source:'c110',maxzoom:3.5,paint:{'fill-color':'#F4F1EA'}},
      {id:'line110',type:'line',source:'c110',maxzoom:3.5,paint:{'line-color':'#B8C2CC','line-width':0.6}},
      {id:'land50',type:'fill',source:'c50',minzoom:3.5,paint:{'fill-color':'#F4F1EA'}},
      {id:'line50',type:'line',source:'c50',minzoom:3.5,paint:{'line-color':'#B8C2CC','line-width':0.8}},
      {id:'cname',type:'symbol',source:'c50',minzoom:3.5,layout:{'text-field':['coalesce',['get','zh'],['get','en']],'text-font':['NotoSansJP Regular'],'text-size':11,'symbol-placement':'point'},paint:{'text-color':'#8A93A0','text-halo-color':'#F4F1EA','text-halo-width':1}},
      {id:'city-halo',type:'circle',source:'cities',paint:{'circle-radius':['interpolate',['linear'],['zoom'],1,7,6,12],'circle-color':'#fff','circle-opacity':0.9}},
      {id:'city-dot',type:'circle',source:'cities',paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],1,4.5,6,8],
        'circle-color':['case',['==',['get','status'],'ready'],'#1B2433','#fff'],
        'circle-stroke-color':['case',['==',['get','status'],'ready'],'#1B2433','#6B7688'],'circle-stroke-width':2}},
      {id:'city-lab',type:'symbol',source:'cities',layout:{'text-field':['get','label'],'text-font':['NotoSansJP Regular'],'text-size':12,'text-offset':[0,1.1],'text-anchor':'top'},paint:{'text-color':'#1B2433','text-halo-color':'#fff','text-halo-width':1.5}}
    ]}},
  // 图层都写在 style 里了；这里只交代「点哪个图层 → 开哪张卡」
  layers(){ return {'city-dot': f=>show(CITIES.find(c=>c.id===f.properties.id))}; },
  // 要素 → 卡片：标题/副标题立刻给，正文取到城市 JSON 再给
  async card(c){
    let d=cache[c.id];
    if(!d){ try{ d=await (await fetch(`data/cities/${c.id}.json`)).json(); }catch(e){ d=null; } cache[c.id]=d; }
    return {title:`${c.name.zh}（${c.name.en}）`, sub:`${COUNTRY[c.country]||c.country} · 货币 ${c.currency}`, html:groups(render(c,d))};
  }
});
map=APP.map;
// 城市列表（sheet 的列表态）
const COUNTRY={JPN:'日本',CHN:'中国',TWN:'台湾',KOR:'韩国',VNM:'越南',MMR:'缅甸',DEU:'德国',USA:'美国',AUS:'澳大利亚'};
const FLAG={JPN:'🇯🇵',CHN:'🇨🇳',TWN:'🇹🇼',KOR:'🇰🇷',VNM:'🇻🇳',MMR:'🇲🇲',DEU:'🇩🇪',USA:'🇺🇸',AUS:'🇦🇺'};
// 建议卡：× 掉记住
try{ if(localStorage.getItem('cost.intro')==='x') $('intro').hidden=true; }catch(e){}
$('introX').addEventListener('click',()=>{ $('intro').hidden=true; try{ localStorage.setItem('cost.intro','x'); }catch(e){} });
$('introMore').addEventListener('click',()=>{ location.href='data/README.md'; });
function cityRows(filter){
  const q=(filter||'').trim().toLowerCase();
  const rows=CITIES.filter(c=>!q||[c.name.zh,c.name.en,c.name.local||'',COUNTRY[c.country]||''].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>(b.status==='ready')-(a.status==='ready'));
  // 地图 App 搜索结果行：34 圆图标（国旗）+ 标题 17 半粗 + 副标题 15 + ›
  // 右侧 = 这座城市「到枢纽 15 分那档每月要打的工时」+ 彩色胶囊（签证上限内 / 超上限 / 待调查）——股市行的形：名字 + 灰副标题，右侧数值 + 胶囊
  const right=c=>{ const hh=HEAD[c.id]; if(!hh) return `<span class="val"><span class="tag gray">${c.status==='ready'?'缺项':'待调查'}</span></span>`;
    const over=hh.cap&&hh.hrs>hh.cap; return `<span class="val"><b>${hh.hrs} 小时<small>/月</small></b><span class="tag ${over?'orange':(hh.cap?'green':'gray')}">${over?'超上限':(hh.cap?'上限内':'无上限')}</span></span>`; };
  $('cityRows').innerHTML=rows.map(c=>`<button class="mrow" data-id="${c.id}"><span class="ico">${FLAG[c.country]||'🏙'}</span><span class="lab"><div class="name">${c.name.zh} <span class="dim" style="font-weight:400">${c.name.en}</span></div><div class="hint">${COUNTRY[c.country]||c.country} · ${c.currency}</div></span>${right(c)}<i class="sf chev" data-sf="chevron.right"></i></button>`).join('')||'<div class="mrow"><span class="lab dim">没有匹配的城市</span></div>';
  HIG.sf();
  $('cityRows').querySelectorAll('button.mrow').forEach(b=>b.addEventListener('click',()=>{const c=CITIES.find(x=>x.id===b.dataset.id); show(c,{center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),4)});}));
}
cityRows(''); loadHeads().then(()=>cityRows($('q').value));
$('q').addEventListener('input',e=>{cityRows(e.target.value); e.target.closest('.search').classList.toggle('has',!!e.target.value);});
$('q').closest('.search').querySelector('.clear').addEventListener('click',()=>{$('q').value='';cityRows('');$('q').closest('.search').classList.remove('has');});

// 汇率：先读仓库里每日自动更新的 rates.json（兜底），再拉一次实时汇率覆盖 fx；下拉里标出汇率日期
fetch('data/rates.json').then(r=>r.json()).then(r=>{RATES=r; fillCur(r.fetched_at, '仓库');
  fetch('https://open.er-api.com/v6/latest/JPY').then(x=>x.json()).then(live=>{
    if(!live||live.result!=='success'||!live.rates) return;
    const fx={}; for(const k of Object.keys(r.fx||{})){ if(live.rates[k]) fx[k]=1/live.rates[k]; }
    if(Object.keys(fx).length){ RATES={...r, fx:{...r.fx,...fx}}; fillCur(new Date(live.time_last_update_unix*1000).toISOString().slice(0,10), '实时'); if(APP.open) show(APP.open); }
  }).catch(()=>{});
}).catch(()=>{});
function fillCur(date, kind){
  const m=$('curMenu'); m.querySelectorAll('button:not([data-value=local])').forEach(o=>o.remove());
  for(const k of Object.keys(RATES.fx||{})){ if(RATES.fx[k]==null) continue; const b=document.createElement('button'); b.type='button'; b.setAttribute('role','menuitemradio'); b.setAttribute('aria-checked', k===CUR?'true':'false'); b.dataset.value=k; b.innerHTML='<i class="sf" data-sf="checkmark"></i>'+k; m.appendChild(b); }
  HIG.sf(); $('curBtn').title=`汇率 ${date}（${kind}）`; const tag=$('curDate'); if(tag) tag.textContent=`汇率 ${date}`;
}
HIG.menu($('curBtn'), $('curMenu'), v=>{CUR=v; $('curLabel').textContent=CUR==='local'?'当地':CUR; if(APP.open) show(APP.open);});
})();

const cache={};
// 城市一眼能比的数：到枢纽 15 分那档「每月要打的工时」= (房租 + 水电燃气 + 手机宽带 + 统计食费 + 通学月票) ÷ 参考时薪；和卡片里「换算成工时」同一公式
// 参考时薪 = 有效岗位的时薪中位数（2026-09-15 起；之前用最低值，一条 24 小时岗就把乌鲁木齐从 229 拉到 316）。
// 有效 = headline!==false：24 小时在岗口径、临时单、郊区、私人家政都不算；卡片里另给最低/最高。
function refWageOf(d){ const V=x=>x&&x.value!=null?x.value:null;
  const ws=(d.jobs||[]).filter(jb=>jb.headline!==false&&V(jb.wage)!=null).map(jb=>V(jb.wage)).sort((a,b)=>a-b);
  if(!ws.length) return {wage:d.wage_ref&&V(d.wage_ref.min_official), n:0, name:'法定最低'};
  const mid=ws.length%2?ws[(ws.length-1)/2]:(ws[ws.length/2-1]+ws[ws.length/2])/2;
  return {wage:Math.round(mid*10)/10, n:ws.length, min:ws[0], max:ws[ws.length-1], name:`${ws.length} 条有效岗位的中位数`}; }
function hoursFor(d){
  if(!d) return null; const V=x=>x&&x.value!=null?x.value:null;
  const refWage=refWageOf(d).wage;
  const u=d.utilities||{}; const util=['electricity','gas','water'].map(k=>V(u[k])).reduce((a,b)=>a+(b||0),0); const comm=(V(u.mobile)||0)+(V(u.internet)||0)||V(u.comm_official)||0;
  const food=d.living_official&&V(d.living_official.food); const tiers=d.tiers||[]; const t=tiers.find(x=>/15/.test(x.label||''))||tiers[1]||tiers[0];
  const rent=t&&V(t.rent_1k); if(!refWage||!food||rent==null) return null;
  const total=rent+util+comm+food+(t&&V(t.pass_student)||0); const cap=d.work&&d.work[0]&&V(d.work[0].rule)?d.work[0].rule.value*52/12:null;
  return {hrs:Math.round(total/refWage), cap:cap&&Math.round(cap), tier:t&&t.label};
}
const HEAD={};   // id → hoursFor 结果；有数据的城市开页就取
function loadHeads(){ return Promise.all(CITIES.filter(c=>c.status==='ready').map(c=>fetch(`data/cities/${c.id}.json`).then(r=>r.json()).then(d=>{cache[c.id]=d; HEAD[c.id]=hoursFor(d);}).catch(()=>{}))); }
function show(c,flyTo){ return APP.present(c, flyTo?{flyTo}:{}); }   // 卡片的打开/叠放/关闭都在壳里；这页只管内容
// render() 的 <section><h3>…</h3>REST</section> → 地图 App 地点卡片：<h2 class="mh">…</h2><div class="mcard">REST</div>；
// 最前面加一颗 50 高的主按钮（地图 App「规划」的位置）：跳到「换算成工时」
function groups(h){
  return '<div style="height:16px"></div>'
        + h.replace(/<section class="raw">([\s\S]*?)<\/section>/g,'$1')
          .replace(/<section>\s*<h3>([^<]*)<\/h3>([\s\S]*?)<\/section>/g,(m,t,rest)=>`<h2 class="mh"${/换算成工时/.test(t)?' id="hours"':''}>${t}</h2><div class="mcard">${rest}</div>`)
          .replace(/<section class="links">([\s\S]*?)<\/section>/g,'<h2 class="mh" id="srcs">来源与相关图</h2><div class="mcard links">$1</div>')
          .replace(/<section class="empty">([\s\S]*?)<\/section>/g,'<div class="mcard"><div class="empty">$1</div></div>')
          .replace(/<section class="src">([\s\S]*?)<\/section>/g,'<p class="mnote">$1</p>'); }
// ---- 渲染：每个数字带置信度芯片和来源；null 一律「暂无」，绝不编数 ----
function money(v,unit,cur){
  if(v==null) return null;
  if(CUR==='local'||!RATES||!RATES.fx[cur]||!RATES.fx[CUR]) return `${v.toLocaleString()} ${unit}`;
  const jpy=v*RATES.fx[cur]; const out=jpy/RATES.fx[CUR];
  return `${Math.round(out).toLocaleString()} ${unit.replace(cur,CUR)}`;
}
function stale(d){ if(!d) return false; const t=Date.parse(d); return isFinite(t) && (Date.now()-t)>365*864e5; }
function num(k,m,cur){
  if(!m) return '';
  const val=money(m.value,m.unit||'',cur);
  const chip=`<span class="chip ${m.confidence||''}">${({official:'官方',listing:'挂牌',measured:'实测',crowd:'众包',estimated:'推算'})[m.confidence]||'?'}</span>`;
  const src=m.source_url?`<a href="${m.source_url}" target="_blank" rel="noopener">${m.source_name||'来源'}</a>`:(m.source_name||'');
  const meta=[src, m.fetched_at?(stale(m.fetched_at)?`<span class="stale">${m.fetched_at} 旧</span>`:m.fetched_at):'', m.n?`n=${m.n}`:'', m.note||''].filter(Boolean).join(' · ');
  return `<div class="r"><span class="k">${k}</span><span class="v ${val==null?'none':''}">${val==null?'暂无':val}${chip}</span></div>${meta?`<div class="src">${meta}</div>`:''}`;
}
function render(c,d){
  if(!d) return '<section class="empty">这个城市还没有数据文件。数据规范见 data/README.md。</section>';
  const cur=d.currency||c.currency; let h='';
  const V=x=>x&&x.value!=null?x.value:null;
  // ---- 动作行（地图 App 地点卡片：主动作 + 次动作等宽）+ 2×2 统计卡（健身 › 摘要 的形）
  const TAG={official:['官方','green'],listing:['挂牌',''],measured:['实测','gray'],crowd:['众包','orange'],estimated:['推算','gray']};
  const tag=m=>m&&m.confidence?`<span class="tag ${TAG[m.confidence]?TAG[m.confidence][1]:''}">${TAG[m.confidence]?TAG[m.confidence][0]:m.confidence}</span>`:'';
  const foot=m=>m?[m.source_url?`<a href="${m.source_url}" target="_blank" rel="noopener">${m.source_name||'来源'}</a>`:(m.source_name||''), m.fetched_at||''].filter(Boolean).join(' · '):'待调查';
  const big=(v,unit)=>{ const t=money(v,unit,cur); if(t==null) return '<span class="dim">暂无</span>'; const m=t.match(/^([\d.,]+)\s*(.*)$/); return m?`${m[1]}<small>${m[2]}</small>`:t; };
  const jobs=(d.jobs||[]).filter(j=>V(j.wage)!=null&&j.headline!==false); const wj=jobs.length?jobs.reduce((a,b)=>V(a.wage)<=V(b.wage)?a:b):null; const RWc=refWageOf(d);
  // 时薪怎么来的：帖子写的工资 ÷ 帖子写的工时（wage-must-carry-hours）；24 小时岗/12 小时班在这里能看见
  const hoursLine=w=>{ const hh=w&&w.hours; if(!hh||(!hh.monthly&&!hh.per_day)) return '';
    const per=hh.per_day?`${hh.per_day} h/天`:'', days=hh.days_per_month?`${hh.days_per_month} 天/月`:'';
    const BASIS={posted:'帖子写明',rule_24h:'上一休一，按 24 h 在岗计',rule_12h:'上一休一可倒班，按 12 h 计'};
    return (w.wage_posted?`${w.wage_posted} `:'')+(hh.monthly?`÷ ${hh.monthly} h/月（${[per,days].filter(Boolean).join(' × ')}${BASIS[hh.basis]?'，'+BASIS[hh.basis]:''}）`:`÷ ${per}`)+(hh.posted?` · 班次「${hh.posted}」`:''); };
  const t15=(d.tiers||[]).find(t=>/15/.test(t.label||''))||(d.tiers||[])[1]; const rent=t15&&t15.rent_1k; const pass=t15&&(t15.pass_student||t15.pass_commuter);
  const foodM=d.living_official&&d.living_official.food;
  h+='<section class="raw"><div class="actions">'
    +'<button class="btn tint" type="button" onclick="document.getElementById(\'hours\')&&document.getElementById(\'hours\').scrollIntoView({behavior:\'smooth\',block:\'start\'})"><i class="sf" data-sf="clock"></i><span>换算成工时</span></button>'
    +'<button class="btn" type="button" onclick="document.getElementById(\'srcs\')&&document.getElementById(\'srcs\').scrollIntoView({behavior:\'smooth\',block:\'start\'})"><i class="sf" data-sf="doc.text"></i><span>来源</span></button>'
    +(c.links&&c.links.reach?`<a class="btn" href="${c.links.reach}"><i class="sf" data-sf="map"></i><span>可达性图</span></a>`:'<button class="btn" type="button" disabled><i class="sf" data-sf="map"></i><span>可达性图</span></button>')
    +'</div><div class="stats" style="margin-top:16px">'
    +`<div class="stat"><div class="t">时薪${wj?tag(wj.wage):''}</div><div class="s">${RWc.n?`${RWc.n} 条有效岗位 · 中位数`:'门店直发挂牌'}</div><div class="n">${RWc.n?big(RWc.wage,(wj.wage.unit||cur+'/小时')):'<span class="dim">暂无</span>'}</div><div class="f">${RWc.n?`最低 ${RWc.min}（${wj.chain}）· 最高 ${RWc.max}`:'没有一条帖子同时写工资和班次'}</div></div>`
    +`<div class="stat"><div class="t">房租${rent?tag(rent):''}</div><div class="s">${t15?t15.label:'到枢纽 15 分'} · 单间</div><div class="n">${rent?big(V(rent),rent.unit||cur+'/月'):'<span class="dim">暂无</span>'}</div><div class="f">${rent?foot(rent):'待调查'}</div></div>`
    +`<div class="stat"><div class="t">通勤${pass?tag(pass):''}</div><div class="s">${t15?t15.label:'到枢纽 15 分'} · 月票</div><div class="n">${pass?big(V(pass),pass.unit||cur+'/月'):'<span class="dim">暂无</span>'}</div><div class="f">${pass?foot(pass):'待调查'}</div></div>`
    +`<div class="stat"><div class="t">食费${foodM?tag(foodM):''}</div><div class="s">统计平均 · 月</div><div class="n">${foodM?big(V(foodM),foodM.unit||cur+'/月'):'<span class="dim">暂无</span>'}</div><div class="f">${foodM?foot(foodM):'待调查'}</div></div>`
    +'</div></section>';
  // ---- 能干什么活
  h+='<section><h3>能干什么活</h3>';
  if(d.work&&d.work.length){ for(const w of d.work){ h+=`<div class="r"><span class="k">${w.visa}</span><span class="v ${V(w.rule)!=null?'':'none'}">${V(w.rule)!=null?w.rule.value+' '+w.rule.unit:(/公民/.test(w.visa)?'无工时上限':'上限暂无')}</span></div>`;
      if(w.rule&&w.rule.note) h+=`<div class="src">${w.rule.note}</div>`;
      if(w.platforms&&w.platforms.length) h+='<div class="src">平台：'+w.platforms.map(p=>p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name}</a>`:p.name).join('、')+'</div>'; } }
  else h+='<div class="empty">待调查</div>';
  h+='</section>';
  // ---- 岗位：连锁 × 门店 × 时薪
  h+='<section><h3>具体岗位（门店直发 / 招工帖，能直接去应聘）</h3>';
  const TAGZH={'24h':'24 小时在岗口径，不进首页中位数',temp:'临时单/日结',suburb:'郊区（离市区远）',home:'私人家庭家政'};
  const jobRow=jb=>{ const hl=hoursLine(jb.wage); const tg=(jb.tags||[]).map(t=>TAGZH[t]||t).join('，'); return num(`${jb.chain}`,Object.assign({},jb.wage,{note:`${jb.store}${tg?' · '+tg:''}${hl?' · '+hl:''}${jb.wage.note?' · '+jb.wage.note:''}`}),cur); };
  const mainJobs=(d.jobs||[]).filter(jb=>jb.headline!==false||(jb.tags||[]).join()==='24h'), sideJobs=(d.jobs||[]).filter(jb=>!mainJobs.includes(jb));
  if(mainJobs.length){ for(const jb of mainJobs) h+=jobRow(jb); }
  else h+='<div class="empty">待调查</div>';
  if(sideJobs.length){ h+='<div class="src" style="margin-top:10px"><b>另列（不进篮子最低值、不进首页）：临时/日结 · 郊区 · 私人家政</b></div>'; for(const jb of sideJobs) h+=jobRow(jb); }
  if(d.wage_ref){ h+='<div class="src" style="margin-top:6px">法定最低：'+[d.wage_ref.min_official,d.wage_ref.min_official_next].filter(x=>x&&x.value!=null).map(x=>`<a href="${x.source_url}" target="_blank" rel="noopener">${x.value.toLocaleString()} ${x.unit}</a>（${x.note||''}）`).join('　')+'</div>'; }
  h+='</section>';
  // ---- 住哪里：四档
  const tiers=d.tiers||[];
  h+='<section><h3>住哪里 · 按到枢纽的分钟数分档</h3>';
  if(d.hub) h+=`<div class="src" style="margin-bottom:6px">枢纽：${d.hub.name}。${d.hub.note||''}</div>`;
  if(tiers.length){
    h+='<div style="overflow-x:auto"><table class="tiers"><thead><tr><th>档位</th><th>代表车站</th><th>单间月租</th><th>通学月票</th><th>通勤月票</th><th>单程</th></tr></thead><tbody>';
    for(const t of tiers){ const cell=x=>x&&x.value!=null?`<a href="${x.source_url||'#'}" target="_blank" rel="noopener" title="${(x.source_name||'')+' · '+(x.note||'')}">${money(x.value,x.unit,cur).replace(/ JPY\/month| JPY/,'')}</a><span class="chip ${x.confidence}"></span>`:'<span class="none">暂无</span>';
      h+=`<tr><td><b>${t.label}</b><div class="src">${t.commute||''}</div></td><td class="src">${(t.stations||[]).join('<br>')}</td><td>${cell(t.rent_1k)}</td><td>${cell(t.pass_student)}</td><td>${cell(t.pass_commuter)}</td><td>${cell(t.fare_single)}</td></tr>`; }
    h+='</tbody></table></div><div class="src">单位 '+cur+'；房租不含礼金、押金、管理费；点数字打开来源，停留看说明。</div>';
  } else h+='<div class="empty">待调查</div>';
  h+='</section>';
  // ---- 地铁分区票价（有分区制的城市才有）
  if(d.transit_zones&&d.transit_zones.zones){ const z=d.transit_zones;
    h+=`<section><h3>${z.label||'地铁分区票价'}</h3><div style="overflow-x:auto"><table class="tiers"><thead><tr><th>分区</th><th>距离 km</th><th>单程</th><th>通学月票</th><th>通勤月票</th></tr></thead><tbody>`;
    for(const r of z.zones) h+=`<tr><td><b>${r.zone}</b></td><td>${r.km}</td><td>${r.single.toLocaleString()}</td><td>${r.student.toLocaleString()}</td><td>${r.commuter.toLocaleString()}</td></tr>`;
    h+=`</tbody></table></div><div class="src"><a href="${z.source_url}" target="_blank" rel="noopener">${z.source_name}</a> · ${z.fetched_at} · ${z.note||''}</div></section>`; }
  // ---- 生活费明细
  h+='<section><h3>水电网络 / 月</h3>';
  if(d.utilities) for(const [k,x] of Object.entries(d.utilities)) h+=num(x.label||k,x,cur); else h+='<div class="empty">待调查</div>';
  h+='</section><section><h3>标准篮子 · 单价</h3>';
  if(d.basket) for(const [k,x] of Object.entries(d.basket)) h+=num(x.label||k,x,cur); else h+='<div class="empty">待调查</div>';
  h+='</section><section><h3>统计平均</h3>';
  if(d.living_official) for(const [k,x] of Object.entries(d.living_official)) h+=num(x.label||k,x,cur);
  h+='</section>';
  // ---- 换算成工时：按档
  const RW=refWageOf(d); const refWage=RW.wage; const refName=RW.name+(RW.n?`（最低 ${RW.min}，最高 ${RW.max}）`:'');
  const u=d.utilities||{}; const util=['electricity','gas','water'].map(k=>V(u[k])).reduce((a,b)=>a+(b||0),0); const comm=(V(u.mobile)||0)+(V(u.internet)||0)||V(u.comm_official)||0;
  const food=d.living_official&&V(d.living_official.food); const capRaw=d.work&&d.work[0]&&V(d.work[0].rule)?d.work[0].rule.value*52/12:null, cap=capRaw&&Math.round(capRaw);
  h+='<section><h3>换算成工时</h3>';
  if(refWage&&food&&tiers.length){
    h+=`<div class="src">按 ${refName} 时薪 ${refWage.toLocaleString()} 算：房租 + 水电燃气 ${util.toLocaleString()} + 手机宽带 ${comm.toLocaleString()} + 统计食费 ${food.toLocaleString()} + 通学月票${cap?`。签证打工上限约 ${cap} 小时/月`:''}</div>`;
    h+='<div style="overflow-x:auto"><table class="tiers"><thead><tr><th>档位</th><th>月开销</th><th>要打的工时</th><th>其中房租</th></tr></thead><tbody>';
    for(const t of tiers){ const r=V(t.rent_1k), ps=V(t.pass_student); if(r==null) { h+=`<tr><td><b>${t.label}</b></td><td class="none">房租暂无</td><td></td><td></td></tr>`; continue; }
      const total=r+util+comm+food+(ps||0); const hrs=total/refWage; const over=capRaw&&Math.round(hrs)>Math.round(capRaw);
      h+=`<tr><td><b>${t.label}</b></td><td>${Math.round(total).toLocaleString()}</td><td><b class="${over?'stale':''}">${Math.round(hrs)} 小时</b>${over?`<div class="src stale">超出上限 ${Math.round(hrs-capRaw)} 小时</div>`:(capRaw&&hrs>capRaw*0.9?'<div class="src">接近上限</div>':'')}</td><td>${Math.round(r/refWage)} 小时</td></tr>`; }
    h+='</tbody></table></div>';
  } else h+='<div class="empty">岗位时薪、统计食费和至少一档房租都有了才算。</div>';
  h+='</section>';
  { const srcs=new Map(); const walk=o=>{ if(!o||typeof o!=='object') return; if(o.source_url&&!srcs.has(o.source_url)) srcs.set(o.source_url,o.source_name||o.source_url.replace(/^https?:\/\//,'').slice(0,40)); for(const k in o){ if(k!=='source_url'&&o[k]&&typeof o[k]==='object') walk(o[k]); } }; walk(d);
    h+='<section class="links">'+(c.links?Object.entries(c.links).map(([k,v])=>`<a href="${v}">${({reach:'车站可达性图（档位的来源）'})[k]||k}</a>`).join(''):'')
      +[...srcs].slice(0,12).map(([u,n])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')+'</section>'; }
  h+=`<section class="src">更新 ${d.updated||'—'} · 状态 ${d.status==='ready'?'可看':'草稿，数据未填完'} · schema ${d.schema||1}</section>`;
  return h;
}
</script>
