<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>薪资 · 购买力</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2334c759'/><text x='32' y='44' font-size='36' font-weight='700' text-anchor='middle' fill='%23fff' font-family='-apple-system,sans-serif'>¥</text></svg>">
<link href="../vendor/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="../ui/hig.css">
<style>
@media (min-width:900px){#card .grab{display:none}}
#card.stacked{z-index:16}
/* 想法见 ../IDEAS.md 第 6 节；数据规范见 data/README.md。
   界面照地图 App：地图全屏；左上一个玻璃圆钮回目录、右上货币；底部一张非模态 Sheet——
   没选城市时是「搜索 + 城市列表」，点了城市就是那座城的卡片。宽屏时 Sheet 变成左侧 320 的侧栏。
   所有尺寸来自 ../ui/hig.css（DESIGN-HIG.md 有出处）。 */
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:.6471em}
.maplibregl-ctrl-bottom-right{bottom:calc(44dvh + 8px)}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0}}
/* 列表行右侧：数值 17 半粗 + 胶囊（股市行的形） */
.mrow .val{display:flex;align-items:center;gap:6px;flex:none;font-variant-numeric:tabular-nums}
.mrow .val b{font-weight:600;white-space:nowrap} .mrow .val b small{font-size:.7647em;font-weight:400;color:var(--ink-2)}
/* 卡片态：render() 输出的 section/h3/.r/.src/table 映射成地图 App 地点卡片（groups()） */
#card .mcard .r{align-items:baseline}
#card .mcard .r .k{color:var(--ink)}
#card .mcard .r .v{font-weight:600}
#card .mcard .r .v.none{font-weight:400}
#card .mcard .src + .r::before{content:none}
#card .mcard > .src:first-child{margin-top:0;padding-top:12px}
.mnote{margin:0;padding:10px var(--inset) 0;color:var(--ink-2);font-size:.7647em;line-height:1.3846em}
.mrow .val{flex:0 0 auto;width:min-content;flex-wrap:wrap;justify-content:flex-end;row-gap:2px}   /* min-content：两行各自不换行，宽度 = 较宽那行，名字那栏才有地方 */
.mrow .lab{flex:1 1 auto;min-width:0} .mrow .lab .name,.mrow .lab .hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val .nrow{flex-basis:100%;font-size:.7059em;line-height:1.3333em;text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:6px;white-space:nowrap}
.val .nrow .tag{font-size:1em}
.mrow .ico.txt{font-size:.7647em;font-weight:600;letter-spacing:.02em;color:var(--ink-2);background:var(--fill)}
.dimlist .mrow .name,.dimlist .mrow .hint{color:var(--ink-3)}
.dimlist .mrow .ico.txt{color:var(--ink-3)}
.mbtn{padding:16px var(--inset) 0}
.chip{display:inline-block;font-size:.6471em;line-height:1.1818em;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle;color:#fff;background:var(--ink-3);font-weight:600}
.chip.official{background:var(--green)} .chip.listing{background:var(--tint)} .chip.measured{background:var(--ink)}
.chip.crowd{background:var(--orange)} .chip.estimated{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.stale{color:var(--orange)}
.derived{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.derived .big{font-size:1.6471em;font-weight:700}
#card .mcard > div[style*="overflow-x"]{padding:0 16px 8px}
table.tiers{border-collapse:collapse;font-size:.7647em;line-height:1.3846em;width:100%}
table.tiers th{font-weight:600;color:var(--ink-2);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tiers td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.tiers tr:last-child td{border-bottom:0}
table.tiers td a{color:var(--ink);font-weight:600;text-decoration:none}
table.tiers .chip{width:6px;height:6px;padding:0;margin-left:4px;vertical-align:middle}
table.tiers .chip.crowd,table.tiers .chip.estimated{width:6px;height:6px;box-shadow:none;background:var(--ink-3)}
#card .links a{display:flex;align-items:center;justify-content:space-between;min-height:47px;padding:12.5px 16px;color:var(--ink);text-decoration:none;position:relative}
#card .links a + a::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
#card .links a::after{content:"›";color:var(--ink-3);margin-left:8px}
/* 岗位行（地图 App 地点卡片列表行的形）：名字 17 半粗 / 灰副题 15 / 元数据 13；右侧时薪 17 半粗；点开详情 */
.job{position:relative} .job + .job::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.job .jr{display:flex;align-items:center;gap:11px;width:100%;min-height:69px;padding:13.5px 16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.job .jr.static{cursor:default}
.job .lab{flex:1 1 auto;min-width:0} .job .name{font-weight:600;line-height:1.2941em} .job .hint{color:var(--ink-2);font-size:.8824em;line-height:1.3333em;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .meta{color:var(--ink-3);font-size:.7647em;line-height:1.3846em;margin-top:2px}
.job .val{flex:none;text-align:right;font-variant-numeric:tabular-nums} .job .val b{font-weight:600;white-space:nowrap} .job .val .dim{font-size:.8824em}
.job .det{padding:0 16px 14px;color:var(--ink-2);font-size:.8824em;line-height:1.3333em}
.job .det .q{padding:10px 12px;border-radius:12px;background:var(--fill);color:var(--ink);white-space:pre-wrap;margin-bottom:8px}
.job .det .src{margin-top:4px} .job .det .cta{margin-top:10px}
.job .btn.s.dis{opacity:.55;pointer-events:none}
.mcard .sub{padding:12px 16px 4px;color:var(--ink-2);font-size:.7647em;line-height:1.3846em;font-weight:600}
</style>
</head>
<body>
<div class="map-shell">
  <div id="map" class="map"></div>
</div>
<div class="bar">
  <a class="btn-glass glass" href="../index.html" aria-label="返回目录"><i class="sf" data-sf="chevron.left"></i></a>
  <span class="spacer"></span>
  <button class="btn-glass glass text cur" id="curBtn" type="button" aria-label="货币"><span id="curLabel">当地</span><i class="sf" data-sf="chevron.down" style="width:.8em;height:.8em"></i></button>
</div>
<aside class="sheet glass split" id="sheet" aria-label="城市">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div id="list">
    <div class="body">
      <!-- 地图 App 首页的「建议卡」：说明这张图是什么，× 掉就记住 -->
      <div class="sugg" id="intro"><span class="ico"><i class="sf" data-sf="yensign"></i></span><div><div class="t">薪资 · 购买力</div><div class="s">时薪、房租、通勤、生活费，换算成每月要打的工时。</div></div><button class="x" type="button" aria-label="关闭" id="introX"><i class="sf" data-sf="xmark"></i></button><button class="a" type="button" id="introMore">数据规范</button></div>
      <h2 class="mh">城市</h2>
      <div class="mlist" id="cityRows"></div>
      <p class="mnote">工时 = 到枢纽 15 分那档的月开销 ÷ 有效岗位时薪中位数　<span id="curDate"></span></p>
      <!-- 还没数据的城市折到最后一组：灰字、无数值（用户 09-15 裁定） -->
      <h2 class="mh" id="draftHead" hidden>待调查</h2>
      <div class="mlist dimlist" id="draftRows" hidden></div>
    </div>
  </div>
  <div id="card" hidden>
    <div class="grab"><i></i></div>
    <div class="head"><span class="slot"></span><div class="tt"><div class="t-title2" id="cName"></div><div class="t-sub dim" id="cMeta"></div></div><span class="slot"><button class="btn-glass fill" id="cClose" aria-label="关闭"><i class="sf" data-sf="xmark"></i></button></span></div>
    <div class="body" id="cBody"></div>
  </div>
</aside>
<!-- 货币：UIMenu 式下拉菜单（hig-kit NUMBERS.md），不用 <select> -->
<div class="menu" id="curMenu" hidden role="menu" aria-label="货币"><button role="menuitemradio" aria-checked="true" data-value="local"><i class="sf" data-sf="checkmark"></i>当地</button></div>

<script src="../ui/sheet.js"></script>
<script src="../ui/press.js"></script>
<script src="../ui/hig.js"></script>
<script src="../vendor/maplibre-gl.js"></script>
<script src="../ui/shell.js"></script>
<script>
const $=id=>document.getElementById(id);
// 城市清单很小，先取到再建图：点直接内嵌进样式的 source，不用等 load 事件
let CITIES=[], RATES=null, CUR='local', map=null, APP=null;
(async()=>{
try{ CITIES=await (await fetch('data/cities.json')).json(); }catch(e){ CITIES=[]; }
// 壳（ui/shell.js）：地图 + Sheet + 叠放卡片 + 点击→卡片；这页只给 layers() 和 card()
APP=HIGShell.create({
  attribution:'© OpenStreetMap contributors · OpenFreeMap',
  // 底图：OpenFreeMap（免费、无密钥、OpenStreetMap 数据）的矢量瓦片，样式 data/style_apple_light.json 照地图 App 浅色配色改的 positron；
  // 有路网和地名，进城不再是一片空白。城市点/标注在 load 后加在最上面。Natural Earth 国界那套只剩离线兜底（fallbackStyle）。
  map:{center:[120,25],zoom:2.2,minZoom:1,maxZoom:17, style:styleUrl()},
  layers(map){ addCities(map); return {'city-dot': f=>{ const c=CITIES.find(x=>x.id===f.properties.id); show(c,{center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),4)}); }}; },   // 点圆点也飞过去（和列表一致）
  // 要素 → 卡片：标题/副标题立刻给，正文取到城市 JSON 再给
  async card(c){
    let d=cache[c.id];
    if(!d){ try{ d=await (await fetch(`data/cities/${c.id}.json`)).json(); }catch(e){ d=null; } cache[c.id]=d; }
    return {title:`${c.name.zh}（${c.name.en}）`, sub:`${COUNTRY[c.country]||c.country} · 货币 ${c.currency}`, html:groups(render(c,d))};
  }
});
map=APP.map;
// 主题跟随系统：暗色换 data/style_apple_dark.json（地图 App 暗色配色），换完把城市点加回去
function styleUrl(){ return new URL(matchMedia('(prefers-color-scheme: dark)').matches?'data/style_apple_dark.json':'data/style_apple_light.json',document.baseURI).href; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ map.setStyle(styleUrl(),{diff:false}); map.once('style.load',()=>addCities(map)); });   // diff:true 会把新样式里没有的 cities 图层删掉且不发 style.load
function addCities(map){
    for(const id of ['city-lab','city-dot','city-halo']) if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource('cities')) map.removeSource('cities');
    const dark=matchMedia('(prefers-color-scheme: dark)').matches, ink=dark?'#F2F2F7':'#1B2433', paper=dark?'#1F1F21':'#fff', dim=dark?'#8E8E93':'#6B7688';
    map.addSource('cities',{type:'geojson',data:{type:'FeatureCollection',features:CITIES.map(c=>({type:'Feature',
        properties:{id:c.id,label:c.name.zh,status:c.status},geometry:{type:'Point',coordinates:[c.lon,c.lat]}}))}});
    // 城市点：地图 App 的城市标注是黑字白描边、没有圆点；我们这里的点是「有数据的城市」这个交互目标，所以留一个小圆点（有数据 = 深色实心，待调查 = 白底灰圈）
    map.addLayer({id:'city-halo',type:'circle',source:'cities',maxzoom:10,paint:{'circle-radius':['interpolate',['linear'],['zoom'],1,7,6,12],'circle-color':paper,'circle-opacity':0.9}});
    map.addLayer({id:'city-dot',type:'circle',source:'cities',maxzoom:10,paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],1,4.5,6,8],
        'circle-color':['case',['==',['get','status'],'ready'],ink,paper],
        'circle-stroke-color':['case',['==',['get','status'],'ready'],ink,dim],'circle-stroke-width':2}});
    // z≥6 底图自己有「乌鲁木齐市」，我们的标签藏掉只留点，免得双写
    map.addLayer({id:'city-lab',type:'symbol',source:'cities',maxzoom:6,layout:{'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[0,1.1],'text-anchor':'top'},paint:{'text-color':ink,'text-halo-color':paper,'text-halo-width':1.5}});
}
// 城市列表（sheet 的列表态）
const COUNTRY={JPN:'日本',CHN:'中国',TWN:'台湾',KOR:'韩国',VNM:'越南',MMR:'缅甸',DEU:'德国',USA:'美国',AUS:'澳大利亚'};
const FLAG={JPN:'🇯🇵',CHN:'🇨🇳',TWN:'🇹🇼',KOR:'🇰🇷',VNM:'🇻🇳',MMR:'🇲🇲',DEU:'🇩🇪',USA:'🇺🇸',AUS:'🇦🇺'};
// 建议卡：× 掉记住
try{ if(localStorage.getItem('cost.intro')==='x') $('intro').hidden=true; }catch(e){}
$('introX').addEventListener('click',()=>{ $('intro').hidden=true; try{ localStorage.setItem('cost.intro','x'); }catch(e){} });
$('introMore').addEventListener('click',()=>{ location.href='data/README.md'; });
const CODE={JPN:'JP',CHN:'CN',TWN:'TW',KOR:'KR',VNM:'VN',MMR:'MM',DEU:'DE',USA:'US',AUS:'AU'};   // 不用 emoji 旗（台北的旗在 iOS 上是方框），用地区代码
function cityRows(){
  // 地图 App 搜索结果行：34 圆图标 + 标题 17 半粗 + 副标题 15 + ›；右侧 = 到枢纽 15 分那档每月要打的工时 + 样本数（股市行的形）
  const capLine=hh=>!hh.visa?'':(/公民/.test(hh.visa)?'本国公民 · 无上限':`${hh.visa} · ${hh.capWeek?`每周 ${hh.capWeek} 小时上限`:'无上限'}`);   // 人话：「留学签证 · 每周 28 小时上限」/「本国公民 · 无上限」
  const right=c=>{ const hh=HEAD[c.id]; if(!hh) return `<span class="val"><span class="tag gray">缺项</span></span>`;
    const over=hh.cap&&hh.hrs>hh.cap; return `<span class="val"><b>${hh.hrs} 小时<small>/月</small></b><small class="dim nrow">${hh.cap?`<span class="tag ${over?'orange':'green'}">${over?'超出上限':'上限内'}</span>`:''}${hh.n} 条岗位</small></span>`; };   // 第二行：签证胶囊 + 样本数，名字那栏才有地方
  const row=c=>{ const hh=HEAD[c.id]||{}; return `<button class="mrow" data-id="${c.id}"><span class="ico txt">${CODE[c.country]||'—'}</span><span class="lab"><div class="name">${c.name.zh} <span class="dim" style="font-weight:400">${c.name.en}</span></div><div class="hint">${capLine(hh)||COUNTRY[c.country]||c.country}</div></span>${right(c)}<i class="sf chev" data-sf="chevron.right"></i></button>`; };
  const ready=CITIES.filter(c=>c.status==='ready'), draft=CITIES.filter(c=>c.status!=='ready');
  $('cityRows').innerHTML=ready.map(row).join('');
  $('draftRows').innerHTML=draft.map(c=>`<button class="mrow" data-id="${c.id}"><span class="ico txt">${CODE[c.country]||'—'}</span><span class="lab"><div class="name dim">${c.name.zh} <span style="font-weight:400">${c.name.en}</span></div><div class="hint">${COUNTRY[c.country]||c.country} · 还没查</div></span><i class="sf chev" data-sf="chevron.right"></i></button>`).join('');
  $('draftHead').hidden=$('draftRows').hidden=!draft.length;
  HIG.sf();
  document.querySelectorAll('#cityRows button.mrow, #draftRows button.mrow').forEach(b=>b.addEventListener('click',()=>{const c=CITIES.find(x=>x.id===b.dataset.id); show(c,{center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),4)});}));
}
cityRows(); loadHeads().then(()=>cityRows());

// 汇率：先读仓库里每日自动更新的 rates.json（兜底），再拉一次实时汇率覆盖 fx；下拉里标出汇率日期
fetch('data/rates.json').then(r=>r.json()).then(r=>{RATES=r; fillCur(r.fetched_at, '仓库');
  fetch('https://open.er-api.com/v6/latest/JPY').then(x=>x.json()).then(live=>{
    if(!live||live.result!=='success'||!live.rates) return;
    const fx={}; for(const k of Object.keys(r.fx||{})){ if(live.rates[k]) fx[k]=1/live.rates[k]; }
    if(Object.keys(fx).length){ RATES={...r, fx:{...r.fx,...fx}}; fillCur(new Date(live.time_last_update_unix*1000).toISOString().slice(0,10), '实时'); if(APP.open) show(APP.open); }
  }).catch(()=>{});
}).catch(()=>{});
function fillCur(date, kind){
  const m=$('curMenu'); m.querySelectorAll('button:not([data-value=local])').forEach(o=>o.remove());
  for(const k of Object.keys(RATES.fx||{})){ if(RATES.fx[k]==null) continue; const b=document.createElement('button'); b.type='button'; b.setAttribute('role','menuitemradio'); b.setAttribute('aria-checked', k===CUR?'true':'false'); b.dataset.value=k; b.innerHTML='<i class="sf" data-sf="checkmark"></i>'+k; m.appendChild(b); }
  HIG.sf(); $('curBtn').title=`汇率 ${date}（${kind}）`; const tag=$('curDate'); if(tag) tag.textContent=`汇率 ${date}`;
}
HIG.menu($('curBtn'), $('curMenu'), v=>{CUR=v; $('curLabel').textContent=CUR==='local'?'当地':CUR; if(APP.open) show(APP.open);});
})();

const cache={};
// 城市一眼能比的数：到枢纽 15 分那档「每月要打的工时」= (房租 + 水电燃气 + 手机宽带 + 统计食费 + 通学月票) ÷ 参考时薪；和卡片里「换算成工时」同一公式
// 参考时薪 = 有效岗位的时薪中位数（2026-09-15 起；之前用最低值，一条 24 小时岗就把乌鲁木齐从 229 拉到 316）。
// 有效 = headline!==false：临时单、郊区、私人家政不算（「上一休一」没写班长的根本不折时薪，进不了 jobs）；卡片里另给最低/最高。
function refWageOf(d){ const V=x=>x&&x.value!=null?x.value:null;
  const ws=(d.jobs||[]).filter(jb=>jb.headline!==false&&V(jb.wage)!=null).map(jb=>V(jb.wage)).sort((a,b)=>a-b);
  if(!ws.length) return {wage:d.wage_ref&&V(d.wage_ref.min_official), n:0, name:'法定最低'};
  const mid=ws.length%2?ws[(ws.length-1)/2]:(ws[ws.length/2-1]+ws[ws.length/2])/2;
  return {wage:Math.round(mid*10)/10, n:ws.length, min:ws[0], max:ws[ws.length-1], name:`${ws.length} 条有效岗位的中位数`}; }
function hoursFor(d){
  if(!d) return null; const V=x=>x&&x.value!=null?x.value:null;
  const refWage=refWageOf(d).wage;
  const u=d.utilities||{}; const util=['electricity','gas','water'].map(k=>V(u[k])).reduce((a,b)=>a+(b||0),0); const comm=(V(u.mobile)||0)+(V(u.internet)||0)||V(u.comm_official)||0;
  const food=d.living_official&&V(d.living_official.food); const tiers=d.tiers||[]; const t=tiers.find(x=>/15/.test(x.label||''))||tiers[1]||tiers[0];
  const rent=t&&V(t.rent_1k); if(!refWage||!food||rent==null) return null;
  const total=rent+util+comm+food+(t&&V(t.pass_student)||0); const cap=d.work&&d.work[0]&&V(d.work[0].rule)?d.work[0].rule.value*52/12:null;
  const w0=d.work&&d.work[0];
  return {hrs:Math.round(total/refWage), cap:cap&&Math.round(cap), tier:t&&t.label, n:refWageOf(d).n, visa:w0&&w0.visa, capWeek:w0&&V(w0.rule)};
}
const HEAD={};   // id → hoursFor 结果；有数据的城市开页就取
function loadHeads(){ return Promise.all(CITIES.filter(c=>c.status==='ready').map(c=>fetch(`data/cities/${c.id}.json`).then(r=>r.json()).then(d=>{cache[c.id]=d; HEAD[c.id]=hoursFor(d);}).catch(()=>{}))); }
function show(c,flyTo){ return APP.present(c, flyTo?{flyTo}:{}); }   // 卡片的打开/叠放/关闭都在壳里；这页只管内容
// render() 的 <section><h3>…</h3>REST</section> → 地图 App 地点卡片：<h2 class="mh">…</h2><div class="mcard">REST</div>；
// 最前面加一颗 50 高的主按钮（地图 App「规划」的位置）：跳到「换算成工时」
function groups(h){
  return '<div style="height:16px"></div>'
        + h.replace(/<section class="raw">([\s\S]*?)<\/section>/g,'$1')
          .replace(/<section>\s*<h3>([^<]*)<\/h3>([\s\S]*?)<\/section>/g,(m,t,rest)=>`<h2 class="mh"${/换算成工时/.test(t)?' id="hours"':''}>${t}</h2><div class="mcard">${rest}</div>`)
          .replace(/<section class="links">([\s\S]*?)<\/section>/g,'<h2 class="mh" id="srcs">来源与相关图</h2><div class="mcard links">$1</div>')
          .replace(/<section class="empty">([\s\S]*?)<\/section>/g,'<div class="mcard"><div class="empty">$1</div></div>')
          .replace(/<section class="src">([\s\S]*?)<\/section>/g,'<p class="mnote">$1</p>'); }
// ---- 渲染：每个数字带置信度芯片和来源；null 一律「暂无」，绝不编数 ----
function money(v,unit,cur){
  if(v==null) return null;
  if(CUR==='local'||!RATES||!RATES.fx[cur]||!RATES.fx[CUR]) return `${v.toLocaleString()} ${unit}`;
  const jpy=v*RATES.fx[cur]; const out=jpy/RATES.fx[CUR];
  return `${Math.round(out).toLocaleString()} ${unit.replace(cur,CUR)}`;
}
function stale(d){ if(!d) return false; const t=Date.parse(d); return isFinite(t) && (Date.now()-t)>365*864e5; }
function num(k,m,cur){
  if(!m) return '';

  const chip=`<span class="chip ${m.confidence||''}">${({official:'官方',listing:'挂牌',measured:'实测',crowd:'众包',estimated:'推算'})[m.confidence]||'?'}</span>`;
  const src=m.source_url?`<a href="${m.source_url}" target="_blank" rel="noopener">${m.source_name||'来源'}</a>`:(m.source_name||'');
  const meta=[src, m.fetched_at?(stale(m.fetched_at)?`<span class="stale">${m.fetched_at} 旧</span>`:m.fetched_at):'', m.n?`n=${m.n}`:'', m.note||''].filter(Boolean).join(' · ');
  return `<div class="r"><span class="k">${k}</span><span class="v ${val==null?'none':''}">${val==null?'暂无':val}${chip}</span></div>${meta?`<div class="src">${meta}</div>`:''}`;
}
// 岗位行：入库条目 chain=「篮子：岗位名」store=「雇主（来源，账号）」；手写条目 chain 带「平替/挂牌」黑话——都在这里整成人话，页面上不出现文件路径、n=、json
function jobTitle(jb){ const ch=jb.chain||'';
  if(jb.ingest_key&&/[:：]/.test(ch)) return (ch.split(/[:：]/)[1]||ch).trim();                       // 入库条目：「保安：保安员」→ 保安员
  if(jb.basket==='chain'&&/[（(]/.test(ch)) return ch.replace(/^.*?[（(]/,'').replace(/[）)].*$/,'');   // 连锁占位：「连锁锚点（麦当劳/肯德基）」→ 麦当劳/肯德基
  const inner=(ch.match(/[（(]([^，,）)]*)/)||[])[1];                                                    // 手写条目：括号里第一段是岗位名就用它（「仓库 / 快递（顺丰运作员，…）」→ 顺丰运作员）
  if(inner&&/员|师|工|保安|服务|店员|收银/.test(inner)&&!/平替|挂牌/.test(inner)) return inner.trim();
  return ch.replace(/\s*[（(].*$/,'').replace(/平替|挂牌/g,'').trim()||'岗位'; }
function jobEmployer(jb){ const st=(jb.store||'').replace(/（.*$/,'').replace(/\(.*$/,'').trim(); return st||'—'; }
function cleanSrc(t){ return (t||'').replace(/[（(][^（()）]*(?:cost\/data|\.json|原始|无障碍树)[^（()）]*[）)]/g,'').replace(/[;；]?\s*原始[^;；。）)]*/g,'').replace(/\bn=\d+/g,'').replace(/\s*·\s*$/,'').replace(/\s{2,}/g,' ').trim(); }
function jobMeta(jb){ const w=jb.wage||{}, hh=w.hours||{}; const parts=[];
  if(w.wage_posted) parts.push(w.wage_posted);
  if(hh.per_day) parts.push(`${hh.per_day} 小时班`); else if(hh.posted) parts.push(hh.posted.length>18?hh.posted.slice(0,18)+'…':hh.posted);
  const shift=(hh.posted||'').match(/上[一二三]休[一二三]|白夜班倒|两班倒|週休二日/); if(shift) parts.push(shift[0]);
  else if(hh.days_per_month) parts.push(hh.days_per_month>=30?'全月无休':`月休 ${30-hh.days_per_month} 天`);
  if(w.posted_at){ const m=w.posted_at.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) parts.push(`${+m[2]} 月 ${+m[3]} 日`); }
  return parts.join(' · '); }
function jobContact(jb){ const w=jb.wage||{}, c=w.contact||'';
  if(/^1[3-9]\d[\d*]{4}\d{4}$/.test(c.replace(/\s/g,''))) return `<span class="btn s dis" aria-disabled="true"><i class="sf" data-sf="phone.fill"></i>${c}</span>`;   // 打了码的号：显示、不可拨
  if(/^\+?[\d\-() ]{7,}$/.test(c)) return `<a class="btn s tint" href="tel:${c.replace(/[^\d+]/g,'')}"><i class="sf" data-sf="phone.fill"></i>打电话</a>`;
  if(/微信/.test(c)) return `<span class="btn s dis">${c}</span>`;
  if(w.source_url) return `<a class="btn s" href="${w.source_url}" target="_blank" rel="noopener"><i class="sf" data-sf="arrow.up.right"></i>${/二维码/.test(c)?'看帖扫码':'去应聘'}</a>`;
  return ''; }
function jobsHtml(d,cur){
  const V=x=>x&&x.value!=null?x.value:null; const TAGZH={temp:'临时单 / 日结',suburb:'郊区（离市区远）',home:'私人家庭家政'};
  const row=jb=>{ const w=jb.wage||{}; const val=V(w); const note=w.note||''; const quote=(note.match(/[“"]([\s\S]*?)[”"]/)||[])[1]; const rest=note.replace(/帖子原文[:：]?[“"][\s\S]*?[”"][。]?/,'').replace(/^正文原文[:：]?[“"][\s\S]*?[”"][;；。]?/,'').trim();

    return `<div class="job" data-x="0"><button class="jr" type="button" aria-expanded="false"><span class="lab"><div class="name">${jobTitle(jb)}</div><div class="hint">${jobEmployer(jb)}</div><div class="meta">${jobMeta(jb)}</div></span><span class="val">${val==null?'<span class="dim">官方不公示</span>':`<b>${money(val,w.unit||cur+'/小时',cur)}</b>`}</span></button>`
      +`<div class="det" hidden>${quote?`<div class="q">“${quote}”</div>`:''}${hl?`<div class="src">算式：${hl}</div>`:''}${rest?`<div class="src">${cleanSrc(rest)}</div>`:''}${src?`<div class="src">${src}</div>`:''}<div class="cta">${jobContact(jb)}</div></div></div>`; };
  const all=(d.jobs||[]); const main=all.filter(jb=>jb.headline!==false&&V(jb.wage)!=null), side=all.filter(jb=>(jb.tags||[]).length&&V(jb.wage)!=null), chain=all.filter(jb=>jb.basket==='chain'&&V(jb.wage)==null);
  let h='';
  if(!main.length) h+='<div class="empty">还没有一条帖子同时写工资和班次</div>';

  const groups={};
  for(const jb of side) for(const t of jb.tags) (groups[t]=groups[t]||[]).push(jb);

  if(d.wage_ref&&d.wage_ref.min_official&&d.wage_ref.min_official.value!=null){ const x=d.wage_ref.min_official; h+=`<div class="src" style="margin-top:6px">法定最低 <a href="${x.source_url}" target="_blank" rel="noopener">${x.value.toLocaleString()} ${x.unit}</a>（只当参考线）</div>`; }
  return h;
}
document.addEventListener('click',e=>{ const b=e.target.closest('#card .job .jr:not(.static)'); if(!b) return; const det=b.parentElement.querySelector('.det'); det.hidden=!det.hidden; b.setAttribute('aria-expanded',String(!det.hidden)); });
function render(c,d){

  const jobs=(d.jobs||[]).filter(j=>V(j.wage)!=null&&j.headline!==false); const wj=jobs.length?jobs.reduce((a,b)=>V(a.wage)<=V(b.wage)?a:b):null; const RWc=refWageOf(d);

      h+=`<tr><td><b>${t.label}</b><div class="src">${t.commute||''}</div></td><td class="src">${(t.stations||[]).join('<br>')}</td><td>${cell(t.rent_1k)}</td><td>${cell(t.pass_student)}</td><td>${cell(t.pass_commuter)}</td><td>${cell(t.fare_single)}</td></tr>`; }
    h+='</tbody></table></div><div class="src">单位 '+cur+'；房租不含礼金、押金、管理费；点数字打开来源，停留看说明。</div>';

    for(const r of z.zones) h+=`<tr><td><b>${r.zone}</b></td><td>${r.km}</td><td>${r.single.toLocaleString()}</td><td>${r.student.toLocaleString()}</td><td>${r.commuter.toLocaleString()}</td></tr>`;
    h+=`</tbody></table></div><div class="src"><a href="${z.source_url}" target="_blank" rel="noopener">${z.source_name}</a> · ${z.fetched_at} · ${z.note||''}</div></section>`; }

}
