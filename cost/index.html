<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>薪资 · 购买力</title>
<meta name="description" content="时薪、房租、通勤、生活费，换算成每月要打的工时。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2334c759'/><text x='32' y='44' font-size='36' font-weight='700' text-anchor='middle' fill='%23fff' font-family='-apple-system,sans-serif'>¥</text></svg>">
<link href="../vendor/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="../ui/hig.css">
<style>
@media (min-width:900px){#card .grab{display:none}}
#card.stacked{z-index:16}
/* 想法见 ../IDEAS.md 第 6 节；数据规范见 data/README.md。
   界面照地图 App：地图全屏；左上一个玻璃圆钮回目录、右上货币；底部一张非模态 Sheet——
   没选城市时是城市列表（三城，不设搜索），点了城市就是那座城的卡片。宽屏时 Sheet 变成左侧侧栏（macOS 27 Kit）。
   所有尺寸来自 ../ui/hig.css（DESIGN-HIG.md 有出处）。 */
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:.6471em}
.maplibregl-ctrl-bottom-right{bottom:calc(44dvh + 8px)}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0}}
/* 列表行右侧：数值 17 半粗 + 第二行小字（股市行的形；Kit Rows › Large 的 trailing Detail 位） */
.mrow .val{display:flex;flex-direction:column;align-items:flex-end;gap:0;flex:0 0 auto;line-height:1.2941em;font-variant-numeric:tabular-nums}
.mrow .val b{font-weight:600;white-space:nowrap} .mrow .val b small{font-size:.7647em;font-weight:400;color:var(--ink-2)}
.mrow .hint .en-hint{display:none}   /* 英文名平时在第一行；Mac 侧栏行（Kit 单行 13）挪到副题开头，见 hig.css 11b */
.val .nrow{font-size:.6471em;line-height:1.3636em;white-space:nowrap} .val .nrow.over{color:var(--orange);font-weight:600}
.dimlist .mrow .name,.dimlist .mrow .hint{color:var(--ink-3)}
/* 卡片态：render() 输出的 section/h3/.r/.src 映射成 Kit 分组列表（groups()）；所有控件样式在 ../ui/hig.css，这里只有对齐 */
#card .mcard .r:not(.disc){align-items:baseline}   /* Kit Rows › Large：trailing Detail 与标题同一基线（y 15）；可展开行的 Disclosure 配件要垂直居中，不改 */
#card .mcard .r .k{color:var(--ink)}
#card .mcard .r .v{font-weight:600}
#card .mcard .r .v.none{font-weight:400}
#card .mcard .src + .r::before{content:none}
#card .mcard > .src:first-child{margin-top:0;padding-top:12px}
#card .mh > .n{margin-left:auto}   /* 段头右端的代表车站数（Kit Sidebars › Header 的 trailing detail 位） */
.stale{color:var(--orange)}
/* 岗位行 / 来源行（Kit Rows › Large 68 + Disclosure；Mac 数字在 hig.css 11b「.sheet .job .jr」）：名字 17 半粗 / 灰副题 15；右侧时薪 17 半粗；点开详情 */
.job{position:relative} .job + .job::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line)}
.job .jr{display:flex;align-items:center;gap:11px;width:100%;min-height:68px;padding:14px 16px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}   /* iOS 27 Kit › Lists › Rows › Large 68 */
.job .jr.static{cursor:default}
.job .lab{flex:1 1 auto;min-width:0} .job .name{font-weight:600;line-height:1.2941em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .job .hint{color:var(--ink-2);font-size:.8824em;line-height:1.2em;margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .det .meta{color:var(--ink-2);margin-bottom:6px} .job .meta .nw{white-space:nowrap}
.job .val{flex:none;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} .job .val b{font-weight:600;white-space:nowrap} .job .val .dim{font-size:.8824em}
.job .det{padding:0 16px 14px;color:var(--ink-2);font-size:.8824em;line-height:1.3333em}
.job .det .mcard{margin:0 0 8px} .job .det .txt{white-space:pre-wrap}   /* 帖子原文 = 嵌套一组（Mac Group Box / iOS 分组列表的文字格），原样换行；只调位置 */
.job .det .src{margin-top:4px} .job .det .cta{margin-top:10px}
.job .btn.s.dis{opacity:.55;pointer-events:none}
.mcard .sub{padding:12px 16px 4px;color:var(--ink-2);font-size:.7647em;line-height:1.3846em;font-weight:600}
/* 来源行展开区：一句「怎么取的」+ 链接；次级列表 = Kit Disclosure 行（.r.disc）+ 同组后续行；对照脚注 */
.job .det .how{color:var(--ink);margin-bottom:4px} .job .det .how a{color:var(--tint);text-decoration:none}
.job .det .foot{margin-top:6px;color:var(--ink-3)}
.job .det details{margin:8px -16px 0;font-size:1.1333em} .job .det details .hint{white-space:normal;overflow:visible}   /* 次级列表顶回卡片边、字号回到 17：行和卡片里其它 .r 行对齐；副题照 .mcard .r 的行折行，不套岗位行的单行截断（位置，不是控件样式） */
@media (min-width:900px) and (pointer:fine){ .job .det details{margin:6px -12px 0;font-size:1.1818em} }
</style>
</head>
<body>
<div class="map-shell">
  <div id="map" class="map"></div>
</div>
<div class="bar">
  <a class="btn-glass glass" href="../index.html" aria-label="返回目录"><i class="sf" data-sf="chevron.left"></i><span class="lb">目录</span></a>
  <span class="spacer"></span>
  <button class="btn-glass glass text cur" id="curBtn" type="button" aria-label="货币"><span id="curLabel">当地</span><i class="sf" data-sf="chevron.down" style="width:.8em;height:.8em"></i></button>
</div>
<aside class="sheet glass split" id="sheet" aria-label="城市">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div id="list">
    <!-- 页头 = Kit Top - Sheet 两行标题（iOS Semibold 15 + Medium 12）/ Mac 窗口标题 Bold 15 + Medium 11；说明句只留在 <title>/<meta>，「数据规范 ›」进段脚（用户 09-16 问题一，和 money 会话商定） -->
    <div class="head"><span class="slot"></span><div class="tt"><div class="t-title2">薪资 · 购买力</div><div class="t-sub dim" id="listSub">城市</div></div><span class="slot"></span></div>
    <div class="body">
      <h2 class="mh">城市</h2>
      <div class="mlist" id="cityRows"></div>
      <p class="mfoot">工时 = 到枢纽 15 分那档的月开销 ÷ 有效岗位时薪的中位数（有月薪岗用月薪岗，没有用时薪岗）　<span id="curDate"></span>　<a href="https://github.com/herclyon1/transit/blob/main/cost/data/README.md" target="_blank" rel="noopener">数据规范 ›</a></p>
      <!-- 还没数据的城市折到最后一组：灰字、无数值（用户 09-15 裁定） -->
      <h2 class="mh" id="draftHead" hidden data-fold="closed">待调查</h2>
      <div class="mlist dimlist" id="draftRows" hidden></div>
    </div>
  </div>
  <div id="card" hidden>
    <div class="grab"><i></i></div>
    <div class="head"><span class="slot"></span><div class="tt"><div class="t-title2" id="cName"></div><div class="t-sub dim" id="cMeta"></div></div><span class="slot"><button class="btn-glass fill" id="cClose" aria-label="关闭"><i class="sf" data-sf="xmark"></i></button></span></div>
    <div class="body" id="cBody"></div>
  </div>
</aside>
<!-- 货币：UIMenu 式下拉菜单（hig-kit NUMBERS.md），不用 <select> -->
<div class="menu" id="curMenu" hidden role="menu" aria-label="货币"><button role="menuitemradio" aria-checked="true" data-value="local"><i class="sf" data-sf="checkmark"></i>当地</button></div>

<script src="../ui/sheet.js"></script>
<script src="../ui/press.js"></script>
<script src="../ui/hig.js"></script>
<script src="../vendor/maplibre-gl.js"></script>
<script src="../ui/shell.js"></script>
<script>
const $=id=>document.getElementById(id);
// 城市清单很小，先取到再建图：点直接内嵌进样式的 source，不用等 load 事件
let CITIES=[], RATES=null, CUR='local', map=null, APP=null;
(async()=>{
let LOADERR=null; try{ const r=await fetch('data/cities.json'); if(!r.ok) throw new Error('HTTP '+r.status); CITIES=await r.json(); }catch(e){ CITIES=[]; LOADERR='城市清单没加载出来（'+(e&&e.message||e)+'），检查网络后刷新。'; }   // 不静默（#15）
// 壳（ui/shell.js）：地图 + Sheet + 叠放卡片 + 点击→卡片；这页只给 layers() 和 card()
APP=HIGShell.create({
  attribution:'',   // 底图样式自带「OpenFreeMap © OpenMapTiles Data from OpenStreetMap」，别再加一份
  // 底图：OpenFreeMap（免费、无密钥、OpenStreetMap 数据）的矢量瓦片，样式 data/style_apple_light.json 照地图 App 浅色配色改的 positron；
  // 有路网和地名，进城不再是一片空白。城市点/标注在 load 后加在最上面。Natural Earth 国界那套只剩离线兜底（fallbackStyle）。
  map:{center:[120,25],zoom:2.2,minZoom:1,maxZoom:17, style:styleUrl()},
  layers(map){ addCities(map); return {'city-dot': f=>{ const c=CITIES.find(x=>x.id===f.properties.id); show(c,{center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),4)}); }}; },   // 点圆点也飞过去（和列表一致）
  // 要素 → 卡片：标题/副标题立刻给，正文取到城市 JSON 再给
  onDismiss(){ markCurrent(null); },
  async card(c){
    let d=cache[c.id];
    if(!d){ try{ d=await (await fetch(`data/cities/${c.id}.json`)).json(); }catch(e){ d=null; } cache[c.id]=d; }
    return {title:`${c.name.zh}（${c.name.en}）`, sub:`${COUNTRY[c.country]||c.country} · 货币 ${c.currency}`, html:groups(render(c,d))};
  }
});
map=APP.map;
// 主题跟随系统：暗色换 data/style_apple_dark.json（地图 App 暗色配色），换完把城市点加回去
function styleUrl(){ return new URL(matchMedia('(prefers-color-scheme: dark)').matches?'data/style_apple_dark.json':'data/style_apple_light.json',document.baseURI).href; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ map.setStyle(styleUrl(),{diff:false}); map.once('style.load',()=>addCities(map)); });   // diff:true 会把新样式里没有的 cities 图层删掉且不发 style.load
function addCities(map){
    for(const id of ['city-lab','city-dot','city-halo','land110']) if(map.getLayer(id)) map.removeLayer(id);
    for(const id of ['cities','land110']) if(map.getSource(id)) map.removeSource(id);
    const dark=matchMedia('(prefers-color-scheme: dark)').matches, ink=dark?'#F2F2F7':'#1B2433', paper=dark?'#1F1F21':'#fff', dim=dark?'#8E8E93':'#6B7688';
    // 首屏兜底（安卓/慢网 OpenFreeMap 瓦片要 5–11 秒）：本地 Natural Earth 110m 陆地面先画在最底下，z≥5 淡出；样式底色在 z≤4 是水色，所以一开始就是「海 + 大陆」
    map.addSource('land110',{type:'geojson',data:new URL('data/countries_110m.geojson',document.baseURI).href});
    map.addLayer({id:'land110',type:'fill',source:'land110',maxzoom:5,paint:{'fill-color':dark?'#1F1F21':'#F4F2ED','fill-opacity':['interpolate',['linear'],['zoom'],4,1,5,0]}},map.getStyle().layers[1]&&map.getStyle().layers[1].id);
    map.addSource('cities',{type:'geojson',data:{type:'FeatureCollection',features:CITIES.map(c=>({type:'Feature',
        properties:{id:c.id,label:c.name.zh,status:c.status},geometry:{type:'Point',coordinates:[c.lon,c.lat]}}))}});
    // 城市点：地图 App 的城市标注是黑字白描边、没有圆点；我们这里的点是「有数据的城市」这个交互目标，所以留一个小圆点（有数据 = 深色实心，待调查 = 白底灰圈）
    map.addLayer({id:'city-halo',type:'circle',source:'cities',maxzoom:10,paint:{'circle-radius':['interpolate',['linear'],['zoom'],1,7,6,12],'circle-color':paper,'circle-opacity':0.9}});
    map.addLayer({id:'city-dot',type:'circle',source:'cities',maxzoom:10,paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],1,4.5,6,8],
        'circle-color':['case',['==',['get','status'],'ready'],ink,paper],
        'circle-stroke-color':['case',['==',['get','status'],'ready'],ink,dim],'circle-stroke-width':2}});
    // z≥6 底图自己有「乌鲁木齐市」，我们的标签藏掉只留点，免得双写
    // 底图自己会写城市名的层级（place 层里 class=city 的 symbol 图层的最小 minzoom，OpenFreeMap 苹果配色样式里是 3）一律不画我们的标签，只留点，免得「乌鲁木齐市」「乌鲁木齐」叠在一起（maa 会话 09-15）；不写死数字，从样式里读
    const cityLabZ=Math.min(...map.getStyle().layers.filter(l=>l.type==='symbol'&&l['source-layer']==='place'&&/"city"/.test(JSON.stringify(l.filter||''))).map(l=>l.minzoom==null?0:l.minzoom).concat([6]));
    map.addLayer({id:'city-lab',type:'symbol',source:'cities',maxzoom:cityLabZ,layout:{'text-field':['get','label'],'text-font':['Noto Sans Bold'],'text-size':12,'text-offset':[0,1.1],'text-anchor':'top'},paint:{'text-color':ink,'text-halo-color':paper,'text-halo-width':1.5}});
    // 底图城市名默认居中压在城市点上，我们的圆点正好盖住中间那个字（手机 z5 看到「东京●都」）：把底图城市名改成点下方（地图 App 的城市标注也是点旁/点下），和我们 z<4 的标签一个写法（用户 09-16 可用性）
    const cityName=['let','n',['coalesce',['get','name:zh'],['get','name:ja'],['get','name']],['case',['>=',['index-of','/',['var','n']],0],['slice',['var','n'],0,['index-of','/',['var','n']]],['var','n']]];   // OSM 里「东京都/東京都」这种双写只留斜杠前
    for(const l of map.getStyle().layers){ if(l.type==='symbol'&&l['source-layer']==='place'&&/^label-city/.test(l.id)){ map.setLayoutProperty(l.id,'text-anchor','top'); map.setLayoutProperty(l.id,'text-offset',[0,0.55]); map.setLayoutProperty(l.id,'text-field',cityName); } }
}
// 城市列表（sheet 的列表态）
const COUNTRY={JPN:'日本',CHN:'中国',TWN:'台湾',KOR:'韩国',VNM:'越南',MMR:'缅甸',DEU:'德国',USA:'美国',AUS:'澳大利亚'};
const FLAG={JPN:'🇯🇵',CHN:'🇨🇳',TWN:'🇹🇼',KOR:'🇰🇷',VNM:'🇻🇳',MMR:'🇲🇲',DEU:'🇩🇪',USA:'🇺🇸',AUS:'🇦🇺'};
// 页头的 trailing Action「数据规范」（Header › Prominent 只有这一个动作位；原建议卡的 × 随卡片一起去掉）
/* 「数据规范」现在是段脚里的链接（Kit Footer），不再有单独按钮 */   // Pages 不渲染 .md，去 GitHub 看渲染过的（#16）
// 国旗 = emoji 圆标（用户 09-15 定，和最初一样）。🇹🇼 在模拟器上画成方框是「地区 = 中国大陆」的系统行为，不是 emoji 的锅（maa 实测：地区改日本、语言仍简中，六面旗都正常）
const flagIco=c=>`<span class="ico">${FLAG[c.country]||'🏙'}</span>`;
function cityRows(){
  // 地图 App 搜索结果行：34 圆图标 + 标题 17 半粗 + 副标题 15 + ›；右侧 = 到枢纽 15 分那档每月要打的工时 + 样本数（股市行的形）
  // 375 宽的行：名字栏只有 ~133px，副题只放得下「留学签 · 周 28h 上限」/「本国公民 · 无上限」；样本数和超上限放右侧第二行 11pt（22+15=37 ≤ 内容高 42，行高仍 69；maa 真机 09-15）
  const capLine=hh=>{ if(!hh.visa) return ''; const v=hh.visa.replace(/签证$/,'签'); return /公民/.test(hh.visa)?'本国公民 · 无上限':`${v} · ${hh.capWeek?`周 ${hh.capWeek}h 上限`:'无上限'}`; };
  const right=c=>{ const hh=HEAD[c.id]; if(hh===undefined&&!HEADS_DONE) return `<span class="val"><span class="dim">…</span></span>`;   // 还没取到
    if(HEADERR[c.id]) return `<span class="val"><span class="dim" title="${HEADERR[c.id]}">没加载出来</span></span>`;   // 网络失败 ≠ 数据缺项（#15）；Kit 行没有胶囊，写成 trailing Detail
    if(!hh) return `<span class="val"><span class="dim">缺项</span></span>`;
    const over=hh.cap&&hh.hrs>hh.cap; return `<span class="val"><b>${hh.hrs} 小时<small>/月</small></b><small class="nrow ${over?'over':'dim'}">${over?'超出上限 · ':''}${hh.n} 条</small></span>`; };
  const row=c=>{ const hh=HEAD[c.id]||{}; return `<button class="mrow" data-id="${c.id}">${flagIco(c)}<span class="lab"><div class="name">${c.name.zh} <span class="en dim" style="font-weight:400">${c.name.en}</span></div><div class="hint"><span class="en-hint">${c.name.en} · </span>${capLine(hh)||COUNTRY[c.country]||c.country}</div></span>${right(c)}<i class="sf chev" data-sf="chevron.right"></i></button>`; };
  const ready=CITIES.filter(c=>c.status==='ready'), draft=CITIES.filter(c=>c.status!=='ready');
  $('cityRows').innerHTML=(LOADERR?`<div class="empty">${LOADERR}</div>`:'')+ready.map(row).join('');
  $('draftRows').innerHTML=draft.map(c=>`<button class="mrow" data-id="${c.id}">${flagIco(c)}<span class="lab"><div class="name dim">${c.name.zh} <span class="en" style="font-weight:400">${c.name.en}</span></div><div class="hint"><span class="en-hint">${c.name.en} · </span>${COUNTRY[c.country]||c.country} · 还没查</div></span><i class="sf chev" data-sf="chevron.right"></i></button>`).join('');
  $('draftHead').hidden=$('draftRows').hidden=!draft.length;
  const ls=$('listSub'); if(ls) ls.textContent=`${ready.length} 座城市有数据`+(draft.length?` · ${draft.length} 座待调查`:'');   // Sheet 头第二行放状态，不放说明句
  HIG.sf();
  document.querySelectorAll('#cityRows button.mrow, #draftRows button.mrow').forEach(b=>b.addEventListener('click',()=>{const c=CITIES.find(x=>x.id===b.dataset.id); show(c,{center:[c.lon,c.lat],zoom:Math.max(map.getZoom(),4)});}));
  if(APP&&APP.open) markCurrent(APP.open.id);   // 重画行后把高亮放回去
}
cityRows(); loadHeads().then(()=>cityRows());
// Mac 侧栏「待调查」段默认折叠（hig.css 11b .mh[data-fold]，Maps 侧栏段头的展开箭头）；手机上段头不可点，属性不起作用
$('draftHead').addEventListener('click',()=>{ const h=$('draftHead'); if(!matchMedia('(min-width: 900px) and (pointer: fine)').matches) return; h.dataset.fold=h.dataset.fold==='open'?'closed':'open'; });

// 汇率：先读仓库里每日自动更新的 rates.json（兜底），再拉一次实时汇率覆盖 fx；下拉里标出汇率日期
fetch('data/rates.json').then(r=>r.json()).then(r=>{RATES=r; fillCur(r.fetched_at, '仓库');
  fetch('https://open.er-api.com/v6/latest/JPY').then(x=>x.json()).then(live=>{
    if(!live||live.result!=='success'||!live.rates) return;
    const fx={}; for(const k of Object.keys(r.fx||{})){ if(live.rates[k]) fx[k]=1/live.rates[k]; }
    if(Object.keys(fx).length){ RATES={...r, fx:{...r.fx,...fx}}; fillCur(new Date(live.time_last_update_unix*1000).toISOString().slice(0,10), '实时'); if(CUR!=='local') rerender(); }   // 当地币不受汇率影响，不重画（#14）
  }).catch(()=>{});
}).catch(()=>{});
function fillCur(date, kind){
  const m=$('curMenu'); m.querySelectorAll('button:not([data-value=local])').forEach(o=>o.remove());
  for(const k of Object.keys(RATES.fx||{})){ if(RATES.fx[k]==null) continue; const b=document.createElement('button'); b.type='button'; b.setAttribute('role','menuitemradio'); b.setAttribute('aria-checked', k===CUR?'true':'false'); b.dataset.value=k; b.innerHTML='<i class="sf" data-sf="checkmark"></i>'+k; m.appendChild(b); }

  // ---- 生活费明细
  h+='<section><h3>水电网络 / 月</h3>';
  if(d.utilities) for(const [k,x] of Object.entries(d.utilities)) h+=srcRow(x.label||UTIL_LABEL[k]||k,x,cur); else h+='<div class="empty">待调查</div>';
  h+='</section><section><h3>基础食材与一顿饭 · 单价</h3>';
  if(d.basket) for(const [k,x] of Object.entries(d.basket)) h+=srcRow(plainLabel(x.label||k),x,cur); else h+='<div class="empty">待调查</div>';
  h+='</section>';
  if(d.living_official&&Object.keys(d.living_official).length){ h+='<section><h3>每月食费与统计对照</h3>'; for(const [k,x] of Object.entries(d.living_official)) h+=srcRow(plainLabel(x.label||k),x,cur); h+='</section>'; }   // 没内容不出空段（#18）
  // ---- 各档要打的工时（KIT-MAP：表格改成每档一组：月开销 / 要打的工时 / 其中房租）
  const RW=refWageOf(d); const refWage=RW.wage; const wUnit=(RW.n&&(d.jobs||[]).find(j=>j.wage&&j.wage.unit)||{wage:{}}).wage.unit||cur+'/小时'; const refName=RW.name+(RW.n?`（最低 ${money(RW.min,wUnit,cur)}，最高 ${money(RW.max,wUnit,cur)}）`:'');
  const u=d.utilities||{}; const util=['electricity','gas','water'].map(k=>V(u[k])).reduce((a,b)=>a+(b||0),0); const comm=(V(u.mobile)||0)+(V(u.internet)||0)||V(u.comm_official)||0;
  const food=d.living_official&&V(d.living_official.food); const capRaw=d.work&&d.work[0]&&V(d.work[0].rule)?d.work[0].rule.value*52/12:null, cap=capRaw&&Math.round(capRaw);
  h+='<section class="raw"><h2 class="mh" id="hours">各档要打的工时</h2>';
  if(refWage&&food&&tiers.length){
    const mUnit=cur+'/月';
    h+=`<p class="mfoot">按 ${refName} 时薪 ${money(refWage,wUnit,cur)} 算：房租 + 水电燃气 ${money(util,mUnit,cur)} + 手机宽带 ${money(comm,mUnit,cur)} + 饮食费（在岗）${money(food,mUnit,cur)} + ${passLabel(d,'student')}${cap?`。签证打工上限约 ${cap} 小时/月`:''}</p>`;
    for(const t of tiers){ const r=V(t.rent_1k), ps=V(t.pass_student);
      if(r==null){ h+=`<h2 class="mh">${t.label}</h2><div class="mcard"><div class="r"><span class="k">月开销</span><span class="v none">房租暂无</span></div></div>`; continue; }
      const total=r+util+comm+food+(ps||0); const hrs=total/refWage; const over=capRaw&&Math.round(hrs)>Math.round(capRaw);
      const note=over?`<div class="hint stale">超出上限 ${Math.round(hrs-capRaw)} 小时</div>`:(capRaw&&hrs>capRaw*0.9?'<div class="hint">接近上限</div>':'');
      h+=`<h2 class="mh">${t.label}</h2><div class="mcard"><div class="r"><span class="k">月开销</span><span class="v">${money(Math.round(total),mUnit,cur)}</span></div>`
        +`<div class="r"><span class="k">要打的工时${note}</span><span class="v${over?' stale':''}">${Math.round(hrs)} 小时</span></div>`
        +`<div class="r"><span class="k">其中房租</span><span class="v">${Math.round(r/refWage)} 小时</span></div></div>`; }
  } else h+='<div class="mcard"><div class="empty">岗位时薪、饮食费和至少一档房租都有了才算。</div></div>';
  h+='</section>';
  { // 来源列：Kit Rows › Large 68（.mrow）：标题 = 帖子/条目标题，副题 = 平台 · 日期，trailing 􀰑（maa 09-15 验收后定的口径：source_name 是内部记录不上页）
    const srcs=new Map(); const seen=new Set();
    const walk=(o,label)=>{ if(!o||typeof o!=='object') return; if(Array.isArray(o)){ o.forEach(x=>walk(x,label)); return; }
      const lb=o.label||o.chain||label;
      if(o.source_url&&!srcs.has(o.source_url)){ const plat=o.source_short||cleanSrc(o.source_name)||o.source_url.replace(/^https?:\/\//,'').split('/')[0]; const title=o.source_title||(lb?plainLabel(String(lb).replace(/^[^：:]*[：:]/,'')):''); const key=plat+'|'+title; if(!seen.has(key)){ seen.add(key); srcs.set(o.source_url,{plat,title,date:fmtDay(o.posted_at||o.fetched_at)}); } }
      for(const k of Object.keys(o)){ if(k!=='source_url'&&k!=='note'&&o[k]&&typeof o[k]==='object') walk(o[k], k==='wage'?lb:(o[k].label||lb)); } };
    walk(d,'');
    h+='<section class="links">'+(c.links?Object.entries(c.links).map(([k,v])=>`<a class="mrow" href="${v}"><span class="lab"><div class="name">${({reach:'车站可达性图'})[k]||k}</div><div class="hint">${({reach:'档位的来源 · 本站'})[k]||'本站'}</div></span><i class="sf chev" data-sf="chevron.right"></i></a>`).join(''):'')
      +[...srcs].map(([u,x])=>`<a class="mrow" href="${u}" target="_blank" rel="noopener"><span class="lab"><div class="name">${x.title||x.plat}</div><div class="hint">${[x.title?x.plat:'',x.date].filter(Boolean).join(' · ')||x.plat}</div></span><i class="sf chev" data-sf="arrow.up.right"></i></a>`).join('')+'</section>'; }
  h+=`<section class="src">更新 ${fmtDay(d.updated)||d.updated||'—'}${d.status==='ready'?'':' · 草稿，数据未填完'}</section>`;
  return h;
}
</script>
