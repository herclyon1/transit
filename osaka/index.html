<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>大阪 · 居住</title>
<link href="../vendor/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="../ui/hig.css">
<style>
/* 界面照地图 App（HIG Maps / Sheets）：地图全屏，左上玻璃圆钮回目录，底部非模态 Sheet 装全部控制项，
   宽屏变左侧 320 侧栏。主题跟随系统（HIG Settings：不做冗余的明暗开关）；地理院没有暗色瓦片，
   深色模式用 MapLibre raster 画笔把底图反色（brightness-min 1 / max 0 + hue-rotate 180），不碰车站点。尺寸出处见 ../DESIGN-HIG.md。 */
:root{--acc:#ff9500;--accTxt:#c25700;--accfg:#fff;--sub:var(--ink-2);--fg:var(--ink);--bg:var(--bg);--line:var(--line);
      --pop:var(--bg-elev);--popfg:var(--ink);--popdim:var(--ink-2);--track:#6b7480;--trackop:0.55;--dim:#aab1ba;--dimbd:#868d96;--ring:#ffffff;--shadow:0 1px 3px #0003;--btn:var(--fill)}
html[data-theme=dark]{--acc:#ffd54f;--accTxt:#ffd54f;--accfg:#1b1500;--track:#fff;--trackop:0.30;--dim:#5b626c;--dimbd:#3a3f47;--ring:#1c1c1e;--shadow:0 1px 3px #000}
#map{position:absolute;inset:0;background:var(--bg)}
.maplibregl-map{font:inherit}
.maplibregl-ctrl-bottom-right{bottom:calc(44dvh + 8px)}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0}}
.maplibregl-ctrl-attrib{font-size:.6471em}
.maplibregl-canvas:focus{outline:none}
/* 枢纽 = 地图 App 里带名字的车站图标：圆角方块 + 白色电车符号，13 半粗标签带白描边 */
.hubmk{background:var(--acc);border-radius:26%;border:1.5px solid #fff;box-shadow:0 1px 3px #0004;display:flex;align-items:center;justify-content:center}
.hubmk .sf{width:62%;height:62%;color:#1b1500}
.hublbl{font-size:.7647em;line-height:1.3846em;font-weight:600;color:#3c3c43;white-space:nowrap;
        text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 3px #fff;letter-spacing:-.01em}
html[data-theme=dark] .hublbl{color:#ebebf5;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000,0 0 3px #000}
/* 车站 popup：HIG popover 的样子——圆角 16、13pt、玻璃底 */
.hpop .maplibregl-popup-content{background:var(--bg-elev);color:var(--ink);border-radius:16px;box-shadow:var(--glass-shadow);padding:12px 26px 12px 14px;font-size:.7647em;line-height:1.3846em}
.hpop .maplibregl-popup-tip{border-top-color:var(--bg-elev);border-bottom-color:var(--bg-elev)}
.hpop.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--bg-elev)} .hpop.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--bg-elev)}
.hpop .maplibregl-popup-close-button{color:var(--ink-2);font-size:1.2em;padding:4px 8px 0 0;background:none}
.tierpop b{font-size:1.1em} .tierpop .t{display:inline-block;padding:0 6px;border-radius:999px;color:#fff;font-weight:700;margin-left:6px}
.warn{color:var(--red)}
.tsw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 2px 0 6px;vertical-align:-1px}
.tsw:first-child{margin-left:0}
/* 图例（可达枢纽）= 地图 App 搜索结果行：34 圆图标就是色样 */
#lg .mrow{min-height:52px;padding:9px 16px}
@media (min-width:900px) and (pointer:fine){#lg .mrow{min-height:44px;padding:11px 16px}}
#lg .mrow .ico{border:1px solid #0003}
.mnote{margin:0;padding:10px var(--inset) 0;color:var(--ink-2);font-size:.7647em;line-height:1.3846em}
#tiersLg{padding-top:10px}
.mcard .r .k .acc{color:var(--acc)}
.hidden-ctl{display:none}
</style>
</head>
<body>
<div class="map-shell"><div id="map" class="map"></div></div>
<div class="bar">
  <a class="btn-glass glass" href="../index.html" aria-label="返回目录"><i class="sf" data-sf="chevron.left"></i></a>
  <span class="spacer"></span>
  <button class="btn-glass glass" id="optBtn" type="button" aria-label="图层"><i class="sf" data-sf="square.stack.3d.up"></i></button>
</div>
<aside class="sheet glass panel-wide" id="sheet" aria-label="控制项">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div class="head"><span class="slot"></span><div class="tt"><div class="t-title2">大阪 · 居住</div><div class="t-sub dim">点车站看时间 · 长按查地点</div></div><span class="slot"></span></div>
  <div class="body">
    <!-- 主抽屉只放「结果」：阈值值卡（形取自健身统计卡，滑块取 Kit）、筛选胶囊、图例。开关类选项在右上「图层」小 Sheet 里 -->
    <div class="stats" id="bar" style="padding-top:2px">
      <div class="stat wide">
        <div class="t">到枢纽的时间<i class="sf" data-sf="clock"></i></div>
        <div class="s">阈值内可达 ≥N 个枢纽的车站才画</div>
        <div class="n" id="thv">25 分</div>
        <div class="r slider" style="padding:8px 0 0;min-height:0"><input type="range" id="th" min="15" max="40" step="1" value="25" aria-label="阈值"></div>
      </div>
    </div>
    <div class="chips" id="minhub" role="group" aria-label="可达枢纽数" style="margin-top:12px"><button data-n="1" class="on" aria-pressed="true">≥1 枢纽</button><button data-n="2" aria-pressed="false">≥2</button><button data-n="3" aria-pressed="false">≥3</button><button data-n="4" aria-pressed="false">全4</button></div>
    <p class="mnote" id="stat"></p>
    <p class="mnote" id="areastat"></p>
    <h2 class="mh">可达枢纽</h2>
    <div class="mlist" id="lg"></div>
    <div id="tiersLg" class="mnote" hidden>
      <i class="tsw" style="background:#3fa57d"></i>S 首选 <i class="tsw" style="background:#8fbf54"></i>A 好
      <i class="tsw" style="background:#e3c24e"></i>B 普通 <i class="tsw" style="background:#e08b45"></i>C 扣分
      <i class="tsw" style="background:#d05252"></i>D 不建议<br>治安×便利×环境，2026 粗略版，点区块看说明</div>
    <div class="mcard" style="margin-top:12px"><div class="txt" id="note">载入中…</div></div>
    <p class="mnote">色 = 最快到达的枢纽 · 点大小 = 阈值内可达的枢纽数</p>
  </div>
</aside>
<!-- 「图层」小 Sheet：地图 App「地图模式」那张的形——标题居中 + 关闭 44，一张卡片放开关行 -->
<aside class="sheet glass opt" id="optSheet" hidden aria-label="图层">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div class="head"><span class="slot"></span><div class="tt"><div class="t-head">图层</div></div><span class="slot"><button class="btn-glass fill" id="optClose" aria-label="关闭"><i class="sf" data-sf="xmark"></i></button></span></div>
  <div class="body">
    <div class="mcard">
      <label class="r"><span class="k">含低频优等</span><span class="sw"><input type="checkbox" id="lowfreq"><i></i></span></label>
      <label class="r"><span class="k">枢纽标记</span><span class="sw"><input type="checkbox" id="hubsOn" checked><i></i></span></label>
      <label class="r"><span class="k">面覆盖（＋步行）</span><span class="sw"><input type="checkbox" id="areaOn"><i></i></span></label>
      <div id="walkWrap" hidden>
        <div class="r"><span class="k">步行</span><span class="v num" id="wkv">10 分</span></div>
        <div class="r slider"><input type="range" id="wk" min="0" max="20" step="1" value="10" aria-label="步行"></div>
        <label class="r"><span class="k">势力范围模式</span><span class="sw"><input type="checkbox" id="terr"><i></i></span></label>
      </div>
      <label class="r"><span class="k">居住等级（面层）</span><span class="sw"><input type="checkbox" id="tiersOn"><i></i></span></label>
    </div>
  </div>
</aside>
<script src="../ui/sheet.js"></script>
<script src="../ui/press.js"></script>
<script src="../ui/hig.js"></script>
<script src="../vendor/maplibre-gl.js"></script>
<script src="../ui/shell.js"></script>
<script>
/* 2026-09-15：Leaflet + 几百个 DOM 圆点 → MapLibre GL（PLAN-v2 §三「统一引擎」）。车站/轨道/等级面层是 GL 图层（缩放跟手），
   面覆盖是一张叠在地图上的 canvas（moveend 重画），枢纽标记和钉子是 Marker（DOM，和 popup 一样不受画布滤镜影响）。
   Leaflet 的 zoom 比 MapLibre 大 1（256 vs 512 瓦片），下面所有阈值用 zL() = MapLibre zoom + 1，和旧代码的数一致。 */
const HUBS = ['梅田','難波','天王寺','京橋'];
// 暗色用と浅色用で別に持つ。暗色の色をそのまま白背景に置くとコントラストが
// 2.2〜3.0:1 しか出ず読めない（WCAG の非テキスト下限は3:1）。
// 浅色用は同じ色相のまま、白背景で3.5:1 以上になる範囲で最も明るい明度を選んである。
const PALETTE = {
  dark:  {'梅田':[255,82,82], '難波':[77,163,255], '天王寺':[102,187,106],
          '京橋':[232,121,249], GOLD:[255,199,0]},
  light: {'梅田':[255,41,41], '難波':[10,128,255], '天王寺':[52,149,57],
          '京橋':[222,10,255], GOLD:[163,127,0]},
};
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
let THEME_MODE = 'auto';   // HIG Settings：跟随系统，不做冗余的明暗开关
function effTheme(){ return THEME_MODE === 'auto' ? (sysDark.matches ? 'dark' : 'light') : THEME_MODE; }
let THEME = effTheme();
let HUE = PALETTE[THEME];
sysDark.addEventListener('change', ()=>{ if(THEME_MODE !== 'auto') return; THEME = effTheme(); applyTheme(); });
const HUB_LL = {'梅田':[34.7025,135.4959],'難波':[34.6636,135.5008],
                '天王寺':[34.6465,135.5140],'京橋':[34.6968,135.5340]};
const PROV_LABEL = {measured:'实测', anchored:'锚定', borrowed:'借用估算'};
const NOTE_HTML = '<b>面覆盖</b>　打开后，每个像素格按「min over 车站（轨道时间 + 步行时间）」'
    +'对四枢纽各算一遍，取最快的那个上色，和站点用同一套逻辑，不做混色。'
    +'步行时间用 <b>OSM 实际步行路网等时圈</b>（Valhalla 引擎，步速 4.8km/h，'
    +'2026-08 取得）分 5/10/15/20 分四带——大川・淀川・阪神高速・铁路这些屏障'
    +'已由路网本身吸收，不再是直线圆盘。帯内用「直线分×该站实测迂回系数」插值并'
    +'夹在帯上下限内：滑块恰为 5/10/15/20 时边界与路网等时圈严格一致，'
    +'中间值平滑过渡。个别取得失败的站退回直线圆（有的话会显示在面板上）。'
    +'<br><br><b>势力范围模式</b>　隐藏车站点，面提高不透明度，'
    +'不同枢纽的交界画出深色分界线——纯看「哪里归谁」。'
    +'<br><br><b>配色</b>　每站按<b>最快到达的那个枢纽</b>着色，不做混色——红+蓝+绿平均出来是灰色，'
    +'和「不可达」的灰无法区分。可达枢纽的<b>数量</b>改用点的大小表示，'
    +'四枢纽全覆盖再加一圈粗边。'
    +'<br><br><b>精度</b>　实测 '+'{M}'+'% ／ 锚定 '+'{A}'+'% ／ 借用估算 '+'{B}'+'%'
    +'<br>实测=Osaka Metro 官方PDF时刻表的逐区间时分。锚定=该线该等级有实测所要时间反解速度。'
    +'借用=同等级中位数，误差可能较大。<b>无独立真值校准，误差为自我交叉验证估计。</b>'
    +'<br><br><b>虚线圈的含义</b>　这些站没有日中≥3本/h 的线，不是「远」而是「班次稀」。'
    +'難波西南侧那一片就属于这类——汐見橋線 30分毎、阪堺線恵美須町側 28分毎，'
    +'打开⚡开关即可看到它们的到达时间。'
    +'<br><br><b class="warn">优等停站型的覆盖</b>　主力 7 条线（京阪本線・南海高野線・'
    +'近鉄南大阪/大阪/奈良線・阪急宝塚本線・阪神本線）的急行/特急停站型已从各线时刻表补入'
    +'（枚方市→京橋 38→18 分、堺東→難波 22→11 分）。仍有 41/80 条线在 OSM 中只有各停停站型，'
    +'其中影响较大的是 JR宝塚線・大阪環状線快速系统，沿线站时间仍偏高估。'
    +'<br><br><b>口径不对称</b>　默认视图只用日中≥3本/h的服务型，边权不含等车时间'
    +'（视作随到随走）；低频优等图层的边额外加期望等待（发车间隔÷2）。两种口径并存是刻意设计。'
    +'<br><br><b>💴 課金</b>　标💴的可达性附带特急券／座席指定券的金钱成本，未计入时间。'
    +'<br><br>枢纽按站群定义（梅田7駅等），到达群内任一站即算到达。换乘罚时：同社3分／跨社5分／'
    +'梅田10分・難波8分・天王寺7分。';
const cssvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);

$('optBtn').addEventListener('click',()=>{ $('optSheet').hidden=false; $('sheet').hidden=true; HIG.sf(); });
$('optClose').addEventListener('click',()=>{ $('optSheet').hidden=true; $('sheet').hidden=false; });
for(const id of ['th','wk']){ const r=$(id); const f=()=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%'); r.addEventListener('input',f); f(); }

// ---- 地图（壳建）：底图 = 国土地理院 淡色地図（官方、免费、无 key）。地理院没有暗色瓦片：暗色主题用 raster 画笔把淡色图反色
//（brightness-min 1 / max 0 = 1−rgb，再 hue-rotate 180、降饱和——和以前的 CSS 滤镜同一套变换，但只作用于底图，不碰车站点）
const APP = HIGShell.create({initial:'medium', attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>',
  map:{center:[135.52,34.66], zoom:10, minZoom:7, maxZoom:17,
    style:{version:8, sources:{ gsi:{type:'raster', tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'], tileSize:256, maxzoom:18} },
      layers:[ {id:'bg',type:'background',paint:{'background-color':'#f2f2f7'}},
               {id:'gsi',type:'raster',source:'gsi',paint:{'raster-fade-duration':0}} ]}},
  layers(map){ return {'stations-hit': f=>openStation(f), 'tiers-fill': (f,e)=>openTier(f,e)}; }});
const map = APP.map; window.map = map;
const zL = () => map.getZoom()+1;              // Leaflet 口径的 zoom
const css = c => 'rgb('+c[0]+','+c[1]+','+c[2]+')';
const EMPTY = {type:'FeatureCollection',features:[]};
function setDark(on){
  if(!map.getLayer('gsi')) return;
  map.setPaintProperty('gsi','raster-brightness-min', on?1:0); map.setPaintProperty('gsi','raster-brightness-max', on?0:1);
  map.setPaintProperty('gsi','raster-hue-rotate', on?180:0); map.setPaintProperty('gsi','raster-saturation', on?-0.55:0); map.setPaintProperty('gsi','raster-contrast', on?-0.08:0);
  map.setPaintProperty('bg','background-color', on?'#000':'#f2f2f7');
}
// 图层顺序（下→上）：底图 › 等级面层 › 轨道 › 车站 › 命中圆
map.on('load', ()=>{
  map.addSource('tiers',{type:'geojson',data:EMPTY});
  map.addLayer({id:'tiers-fill',type:'fill',source:'tiers',paint:{'fill-color':['get','col'],'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.65,0.45]}});
  map.addLayer({id:'tiers-line',type:'line',source:'tiers',paint:{'line-color':'#fff','line-opacity':0.7,'line-width':['case',['==',['get','kind'],'zone'],1,0.6]}});
  map.addSource('lines',{type:'geojson',data:EMPTY});
  map.addLayer({id:'lines',type:'line',source:'lines',paint:{'line-color':cssvar('--track'),'line-opacity':parseFloat(cssvar('--trackop')),
    'line-width':['step',['zoom'],0.7,10,1.0,12,1.6]}});   // 旧：z≥13 1.6 / z≥11 1.0 / 其余 0.7（Leaflet zoom，这里减 1）
  map.addSource('stations',{type:'geojson',data:EMPTY});
  // 地图 App 公共交通模式（iOS 27，東京駅周边实测 2026-09-15 11:51）：车站 = 线路色实心点 ≈5pt + 1pt 白圈，没有黑描边；
  // 这里颜色 = 最快枢纽，四枢纽全达的点更大、白圈更粗；不可达 = 灰点细边；仅低频 = 空心橙圈（GL 画不了虚线圆，用半透明描边代替）
  map.addLayer({id:'stations',type:'circle',source:'stations',paint:{
    'circle-radius':['get','r'],'circle-color':['get','fill'],'circle-opacity':['get','fo'],
    'circle-stroke-color':['get','ring'],'circle-stroke-width':['get','w'],'circle-stroke-opacity':['get','so']}});
  // 見た目の半径が小さいと指でもマウスでも押しにくいので、同じ popup を持つ透明な当たり判定の円を上に重ねる
  map.addLayer({id:'stations-hit',type:'circle',source:'stations',paint:{'circle-radius':['get','hr'],'circle-opacity':0,'circle-stroke-width':0}});
  setDark(THEME==='dark');
  fetch('data/lines_osaka.json').then(r=>r.json()).then(ls=>{
    map.getSource('lines').setData({type:'FeatureCollection',features:ls.map(l=>({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:l.c.map(p=>[p[1],p[0]])}}))});
  });
  drawHubs(); if(DATA) render();
});

// ---- 枢纽マーカー（Marker = DOM，和以前的 divIcon 一样）: ズームに合わせて大きさを変え、低倍ではラベルを畳む
const hubMarkers = [];
function drawHubs(){
  for(const m of hubMarkers) m.remove(); hubMarkers.length = 0;
  const el = $('hubsOn'); if(el && !el.checked) return;
  const z = zL();
  const s = z>=14?16:(z>=12?13:(z>=11?11:(z>=10?8:6)));
  for(const [nm,ll] of Object.entries(HUB_LL)){
    const d = document.createElement('div'); d.className='hubmk'; d.style.cssText='width:'+s+'px;height:'+s+'px;pointer-events:none';
    d.innerHTML='<i class="sf" style="--sf:url(../ui/sf/tram.fill.png)"></i>';
    hubMarkers.push(new maplibregl.Marker({element:d, anchor:'center'}).setLngLat([ll[1],ll[0]]).addTo(map));
    if(z>=11){ const l=document.createElement('div'); l.className='hublbl'; l.textContent=nm; l.style.pointerEvents='none';
      hubMarkers.push(new maplibregl.Marker({element:l, anchor:'left', offset:[s/2+3,0]}).setLngLat([ll[1],ll[0]]).addTo(map)); }
  }
}
map.on('zoomend', drawHubs);
$('hubsOn').addEventListener('change', drawHubs);

// 複数枢纽に届く駅を混色で塗ると識別不能になる（赤+青+緑の平均はほぼ灰色）。色は「最も速く着く枢纽」1つで決め、届く数は大きさと輪郭で表す。
function fastestHub(t){ let bi=-1, bv=Infinity; t.forEach((v,i)=>{ if(v!==null && v<bv){ bv=v; bi=i; } }); return bi; }
let DATA=null;
const WALK_M_PER_MIN = 80;   // 4.8km/h（等時圏の取得時も同じ歩速を指定してある）
// 実路網の徒歩等時圏（5/10/15/20分, station_id → {5:[ring...],...}）。2MB 級なので面覆盖を初めて開いたときに読む
let WALK = null, WALK_K = null, walkLoading = null;
// 帯内補間用の迂回係数 k_m = m/μ（μ = 帯輪郭頂点までの直線徒歩分の平均）：帯の中でも滑らかに面が育つ
function prepWalkK(){
  const byId = {}; for(const s of DATA.stations) byId[s.station_id] = s;
  WALK_K = {};
  for(const sid in WALK){
    const s = byId[sid]; if(!s) continue;
    const cosL = Math.cos(s.lat*Math.PI/180), ks = {};
    for(const m of [5,10,15,20]){
      const rings = WALK[sid][m]; if(!rings) continue;
      let sum=0, n=0;
      for(const r of rings) for(const pt of r){ sum += Math.hypot((pt[0]-s.lat)*111320, (pt[1]-s.lon)*111320*cosL); n++; }
      const mu = (sum/n)/WALK_M_PER_MIN;
      ks[m] = Math.min(3, Math.max(1, mu>0 ? m/mu : 1));
    }
    WALK_K[sid] = ks;
  }
}
function ensureWalk(){
  if(WALK || walkLoading) return;
  walkLoading = fetch('data/walk_polys.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(w=>{
    WALK = w; if(DATA) prepWalkK(); if(area.on) area.draw();
  }).catch(e=>{ console.warn('walk_polys 読み込み失敗、直線円で継続', e); });
}

// ---- 面カバレッジ: 画面をセル格子に切り、各セルについて ある枢纽hへの総時間 = min over 駅s ( 軌道時間(s→h) + 徒歩時間(セル→s) )
// を求め、4枢纽のうち最小のものの色で塗る。格子解像度の小さい canvas に描いてから平滑化を効かせて拡大する。
// 引擎换了以后：canvas 叠在地图容器上（不进画布），moveend/zoomend/resize 重画，拖动/缩放中先隐藏（和以前 zoomstart 一样）。
const area = {
  on:false, c:null,
  add(){ if(this.on) return; this.on=true;
    if(!this.c){ this.c=document.createElement('canvas'); this.c.className='area'; this.c.style.cssText='position:absolute;inset:0;pointer-events:none;transition:opacity .12s'; map.getContainer().appendChild(this.c);
      map.on('movestart',()=>{ if(this.on) this.c.style.opacity='0'; }); map.on('moveend',()=>{ if(this.on) this.reset(); }); map.on('resize',()=>{ if(this.on) this.reset(); }); }
    this.reset(); },
  remove(){ this.on=false; if(this.c){ this.c.style.opacity='0'; } },
  reset(){ const cv=map.getContainer(); const dpr=Math.min(2, window.devicePixelRatio||1); this.c.width=cv.clientWidth*dpr; this.c.height=cv.clientHeight*dpr; this.c.style.width=cv.clientWidth+'px'; this.c.style.height=cv.clientHeight+'px'; this.draw(); this.c.style.opacity='1'; },
  draw(){
    if(!DATA || !this.c) return;
    const cv=map.getContainer(), size={x:cv.clientWidth,y:cv.clientHeight};
    const ctx=this.c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,this.c.width,this.c.height);
    const A = +$('th').value, B = +$('wk').value, low = $('lowfreq').checked;
    if(B<=0) return;
    // 1px あたりのメートル数（緯度で変わる）
    const c0 = map.unproject([0, size.y/2]), c1 = map.unproject([100, size.y/2]);
    const mPerPx = c0.distanceTo(c1)/100;
    const dpr = this.c.width / size.x;
    const RdevRaw = (B*WALK_M_PER_MIN)/mPerPx*dpr;    // 格子はデバイスpx基準
    const margin = RdevRaw/dpr + 20;
    const acts = [];
    for(const s of DATA.stations){
      const t = low ? s.t_low : s.t_default;
      let any=false; for(let h=0;h<4;h++) if(t[h]!==null && t[h]<=A){any=true;break;}
      if(!any) continue;
      const p = map.project([s.lon,s.lat]);
      if(p.x < -margin || p.y < -margin || p.x > size.x+margin || p.y > size.y+margin) continue;
      acts.push({p,t, polys: WALK ? (WALK[s.station_id]||null) : null, ks: WALK_K ? WALK_K[s.station_id] : null});
    }
    if(!acts.length) return;
    const BUDGET = 2.5e6; let CELLdev = 6;
    for(let c=1;c<=6;c++){ const w = Math.ceil(this.c.width/c), h = Math.ceil(this.c.height/c); const rc = RdevRaw/c;
      if(acts.length*Math.min(Math.PI*rc*rc, w*h) + w*h <= BUDGET){ CELLdev=c; break; } }
    const W = Math.ceil(this.c.width/CELLdev), H = Math.ceil(this.c.height/CELLdev);
    const Rc  = RdevRaw/CELLdev; if(Rc < 0.4) return;
    const mPerDev = mPerPx/dpr, minPerCell = (CELLdev*mPerDev)/WALK_M_PER_MIN;
    const best = new Float32Array(W*H*4).fill(Infinity);
    const Rc2 = Rc*Rc, Ri = Math.ceil(Rc);
    // 手動メルカトル（MapLibre の世界幅 512·2^z）＋参照点差分でセル座標へ直接落とす（頂点は30万点級）
    const ws = 512 * Math.pow(2, map.getZoom());
    const refLL = [34.66, 135.52], refCP = map.project([refLL[1],refLL[0]]);
    const k = dpr/CELLdev;
    const offX = (refLL[1]+180)/360*ws - refCP.x;
    const offY = (0.5 - Math.log(Math.tan(Math.PI/4 + refLL[0]*Math.PI/360))/(2*Math.PI))*ws - refCP.y;
    const projCX = lon => ((lon+180)/360*ws - offX)*k;
    const projCY = lat => ((0.5 - Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360))/(2*Math.PI))*ws - offY)*k;
    let noPoly = 0;
    for(const {p,t,polys,ks} of acts){
      const cx = p.x*dpr/CELLdev, cy = p.y*dpr/CELLdev;
      if(polys){
        let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
        const cont = [];
        for(const m of [5,10,15,20]){
          if(m-5 >= B) break; if(!polys[m]) continue;
          cont.push({low:m-5, rings:polys[m].map(r=>{ const n=r.length, f=new Float64Array(2*n);
            for(let i=0;i<n;i++){ const x=projCX(r[i][1]), y=projCY(r[i][0]); f[2*i]=x; f[2*i+1]=y; if(x<mnX)mnX=x; if(x>mxX)mxX=x; if(y<mnY)mnY=y; if(y>mxY)mxY=y; }
            return f; })});
        }
        if(!cont.length){ noPoly++; continue; }
        const x0 = Math.max(0, Math.floor(mnX)), x1 = Math.min(W-1, Math.ceil(mxX));
        const y0 = Math.max(0, Math.floor(mnY)), y1 = Math.min(H-1, Math.ceil(mxY));
        if(x1<x0 || y1<y0) continue;
        const bw = x1-x0+1, rows = y1-y0+1;
        for(const c of cont){
          c.rowXs = Array.from({length: rows}, ()=>[]);
          for(const f of c.rings){ const n = f.length/2;
            for(let i=0;i<n;i++){ const j = i+1<n ? i+1 : 0; const ax=f[2*i], ay=f[2*i+1], bx=f[2*j], by=f[2*j+1];
              const ylo = ay<by?ay:by, yhi = ay<by?by:ay;
              let ry = Math.max(y0, Math.ceil(ylo-0.5)); const ryEnd = Math.min(y1, Math.ceil(yhi-0.5)-1);
              for(; ry<=ryEnd; ry++){ const yc = ry+0.5; c.rowXs[ry-y0].push(ax + (yc-ay)/(by-ay)*(bx-ax)); } } }
        }
        const rowLow = new Float32Array(bw);
        for(let y=y0; y<=y1; y++){
          rowLow.fill(-1); const yc = y+0.5;
          for(const c of cont){ const xs = c.rowXs[y-y0]; if(xs.length<2) continue; xs.sort((u,v)=>u-v);
            for(let k=0;k+1<xs.length;k+=2){ const xa=Math.max(x0, Math.ceil(xs[k]-0.5)), xb=Math.min(x1, Math.floor(xs[k+1]-0.5));
              for(let x=xa;x<=xb;x++) if(rowLow[x-x0]<0) rowLow[x-x0]=c.low; } }
          const dy = yc-cy, dy2=dy*dy;
          for(let x=x0;x<=x1;x++){
            const lo = rowLow[x-x0]; if(lo<0) continue;
            const dx = x+0.5-cx; const kk = ks ? (ks[lo+5] || 1.3) : 1.3;
            let walk = Math.sqrt(dx*dx+dy2)*minPerCell*kk;
            if(walk <= lo) walk = lo+0.01; else if(walk > lo+5) walk = lo+5;
            if(walk > B) continue;
            const base = (y*W+x)*4;
            for(let h=0;h<4;h++){ const tv = t[h]; if(tv===null || tv>A) continue; const v = tv + walk; if(v < best[base+h]) best[base+h] = v; }
          }
        }
        continue;
      }
      noPoly++;   // 等時圏の無い駅は直線円
      const x0 = Math.max(0, Math.floor(cx-Ri)), x1 = Math.min(W-1, Math.ceil(cx+Ri));
      const y0 = Math.max(0, Math.floor(cy-Ri)), y1 = Math.min(H-1, Math.ceil(cy+Ri));
      for(let y=y0; y<=y1; y++){ const dy = y+0.5-cy, dy2 = dy*dy;
        for(let x=x0; x<=x1; x++){ const dx = x+0.5-cx, d2 = dx*dx+dy2; if(d2 > Rc2) continue;
          const walk = Math.sqrt(d2)*minPerCell; const base = (y*W+x)*4;
          for(let h=0;h<4;h++){ const tv = t[h]; if(tv===null || tv>A) continue; const v = tv + walk; if(v < best[base+h]) best[base+h] = v; } } }
    }
    const ast = $('areastat');
    if(ast) ast.textContent = (WALK && noPoly>0) ? '面覆盖: '+noPoly+' 站无路网等时圈，用直线圆代替' : (!WALK ? '面覆盖: 路网等时圈载入中…（先以直线圆显示）' : '');
    const terr = $('terr').checked; const ALPHA = terr ? 235 : 175;
    const img = ctx.createImageData(W,H); const px = img.data; const cols = HUBS.map(h=>HUE[h]);
    const who = new Int8Array(W*H).fill(-1); let covered = 0;
    for(let i=0;i<W*H;i++){ let bi=-1, bv=Infinity; for(let h=0;h<4;h++){ const v=best[i*4+h]; if(v<bv){bv=v;bi=h;} }
      const o = i*4; if(bi<0){ px[o+3]=0; continue; } covered++; who[i]=bi; const c = cols[bi]; px[o]=c[0]; px[o+1]=c[1]; px[o+2]=c[2]; px[o+3]=ALPHA; }
    if(terr){   // 勢力圏モード: 別の枢纽と接するセルを暗くして国境線を立たせる
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, b=who[i]; if(b<0) continue;
        const r=(x+1<W)?who[i+1]:b, d=(y+1<H)?who[i+W]:b;
        if((r>=0&&r!==b)||(d>=0&&d!==b)){ const o=i*4; px[o]=px[o]*0.35; px[o+1]=px[o+1]*0.35; px[o+2]=px[o+2]*0.35; } } }
    const off = document.createElement('canvas'); off.width=W; off.height=H; off.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.filter = CELLdev > 2 ? 'blur('+(CELLdev*0.35).toFixed(1)+'px)' : 'none';
    ctx.drawImage(off, 0, 0, this.c.width, this.c.height); ctx.filter = 'none';
  }
};

// 縮小すると点が相対的に大きくなって団子になるので、zoom に応じて縮める（基準 Leaflet zoom 11、1段縮小ごとに 0.72 倍、拡大側は 1.0 で頭打ち）
const BASE_ZOOM = 11;
function zoomScale(){ return Math.max(0.22, Math.min(1.0, Math.pow(0.72, BASE_ZOOM - zL()))); }
let MINHUBS = 1;   // 閾値内で届く枢纽数がN以上の駅だけ表示する
document.querySelectorAll('#minhub button').forEach(b=>{ b.addEventListener('click',()=>{ MINHUBS = +b.dataset.n;
  document.querySelectorAll('#minhub button').forEach(x=>{ x.classList.toggle('on', x===b); x.setAttribute('aria-pressed', x===b?'true':'false'); });
  if(DATA) render(); }); });

let BYID = {};   // station_id → 车站（popup 用）
function render(){
  const th = +$('th').value, low = $('lowfreq').checked;
  $('thv').textContent = th+' 分';
  const dim = cssvar('--dim'), dimbd = cssvar('--dimbd'), acc = cssvar('--acc'), ring = cssvar('--ring');
  const zs = zoomScale();
  const fullW = Math.max(1.1, 2.2*zs), normW = Math.max(0.5, 1.0*zs);   // 縮小時は枠線も細く
  let reach=0, all4=0, onlyLow=0, shown=0;
  const draws = [];   // {s,cls,rank,r,props}
  for(const s of DATA.stations){
    const t = low ? s.t_low : s.t_default;
    const set = HUBS.filter((h,i)=> t[i]!==null && t[i]<=th);
    const inOsaka = s.in_osaka;
    if(set.length===0){
      if(!inOsaka || MINHUBS>1) continue;
      const noService = s.t_default.every(x=>x===null), lowOk = s.t_low.some(x=>x!==null);
      if(!low && noService && lowOk){ onlyLow++; const rr = Math.max(2.0, 3.0*zs);
        draws.push({s,cls:'lowonly',rank:0,r:rr,props:{r:rr,fill:dim,fo:0.22,ring:acc,w:Math.max(0.9,1.6*zs),so:0.75}});
      }else{ const rr = Math.max(1.4, 2.2*zs);
        draws.push({s,cls:'dim',rank:0,r:rr,props:{r:rr,fill:dim,fo:0.85,ring:dimbd,w:Math.max(0.4,0.8*zs),so:1}}); }
      continue;
    }
    reach++; if(set.length===4) all4++;
    if(set.length < MINHUBS) continue;
    shown++;
    const full = set.length===4, fh = fastestHub(t);
    const r = Math.max(2.0, (inOsaka ? (2.9 + set.length*0.65) : (2.2 + set.length*0.45)) * zs);
    const mn = Math.min(...t.filter(v=>v!==null));
    draws.push({s,cls:'reach',rank:set.length*1000-mn,r,props:{r: full ? r+0.6 : r, fill:css(HUE[HUBS[fh]]), fo:inOsaka?1:0.6, ring, w: full ? fullW : normW, so:1}});
  }
  // zoom 10 以下では物理的に重なる：同一格子内はクラス別に代表 1 駅だけ描く（集計は間引き前）。勢力圏モード: 駅の点は描かない
  const terrHide = $('areaOn').checked && $('terr').checked;
  let out = terrHide ? [] : draws;
  if(out.length && zL() <= 10){
    const cell = zL() >= 10 ? 6 : 8; const cellPick = new Map();
    for(const d of draws){ const p = map.project([d.s.lon, d.s.lat]); const key = d.cls+':'+Math.floor(p.x/cell)+':'+Math.floor(p.y/cell);
      const cur = cellPick.get(key); if(!cur || d.rank > cur.rank) cellPick.set(key, d); }
    out = [...cellPick.values()];
  }
  BYID = {}; for(const s of DATA.stations) BYID[s.station_id]=s;
  const src = map.getSource('stations');
  if(src) src.setData({type:'FeatureCollection',features:out.map(d=>({type:'Feature',properties:Object.assign({id:d.s.station_id, hr:Math.max(9, d.r+5)},d.props),geometry:{type:'Point',coordinates:[d.s.lon,d.s.lat]}}))});
  $('stat').innerHTML = `阈值内可达 <b>${reach}</b> 站 · 四枢纽全覆盖 <b>${all4}</b> 站` + (MINHUBS>1 ? `<br>筛选 ≥${MINHUBS} 枢纽: 显示 ${shown} 站` : '') + (onlyLow ? `<br>仅低频线可达 ${onlyLow} 站` : '');
}

// ---- popup（HIG popover 的样子，样式在 .maplibregl-popup-content）；空白タップで閉じる（長押し直後の合成 click は無視）
let POP = null, lastLongPress = 0;
function openPopup(lnglat, html, opts={}){
  if(POP) POP.remove();
  POP = new maplibregl.Popup(Object.assign({closeOnClick:false, maxWidth:'280px', offset:opts.offset||8, className:'hpop'},opts)).setLngLat(lnglat).setHTML(html).addTo(map);
  POP.on('close', ()=>{ if(opts.onClose) opts.onClose(); });
  return POP;
}
function openStation(f){ const s=BYID[f.properties.id]; if(!s) return; const low=$('lowfreq').checked, th=+$('th').value; openPopup([s.lon,s.lat], popup(s, low?s.t_low:s.t_default, low, th)); }
map.on('click', e=>{ if(Date.now() - lastLongPress > 700 && POP && !map.queryRenderedFeatures(e.point,{layers:['stations-hit','tiers-fill'].filter(l=>map.getLayer(l))}).length){ POP.remove(); POP=null; } });

function popup(s,t,low,th){
  const fg = cssvar('--popfg'), dim = cssvar('--popdim');
  let h = '<b>'+s.name+'</b>';
  if(s.ops && s.ops.length) h += ' <span style="color:'+dim+'">'+s.ops.join('/')+'</span>';
  if(!s.in_osaka) h += ' <span style="color:'+dim+'">(府外)</span>';
  h += '<table style="margin-top:5px;border-collapse:collapse">';
  let mn=null;
  HUBS.forEach((hub,i)=>{
    const v=t[i]; if(v!==null && (mn===null || v<mn)) mn=v;
    let mark='';
    if(low && s.via[i] && (s.t_default[i]===null || s.t_low[i] < s.t_default[i]-0.01)){
      mark = ' <span title="经由低频优等">⚡</span>'+(s.fare[i]?'<span title="需特急券">💴</span>':'') + '<span style="color:'+dim+';font-size:11px"> 経由 '+s.via[i]+'</span>'; }
    const inTh = v!==null && v<=th;
    h += '<tr><td style="padding:1px 8px 1px 0"><span class="tsw" style="background:'+css(HUE[hub])+'"></span> '+hub+'</td>'
      + '<td style="padding:1px 8px 1px 0;color:'+(inTh?fg:dim)+';'+(inTh?'font-weight:700':'')+'">'+(v===null?'不可达':v.toFixed(1)+' 分')+'</td>'
      + '<td style="color:'+dim+';font-size:11px">'+(s.prov[i]?PROV_LABEL[s.prov[i]]:'—')+mark+'</td></tr>';
  });
  h += '</table><div style="margin-top:4px;color:'+fg+'">最短 '+(mn===null?'—':mn.toFixed(1)+' 分')+'</div>';
  if(s.t_default.every(x=>x===null) && s.t_low.some(x=>x!==null)) h += '<div style="margin-top:5px;color:'+dim+';font-size:11px">日中3本/h以上の系統が無い駅。既定ビューでは不可达、⚡を入れると到達可能</div>';
  return h;
}

function buildLegend(){
  const lg=$('lg'); lg.innerHTML='';
  const add=(sw,txt,muted)=>{ const r=document.createElement('div'); r.className='mrow';
    r.innerHTML='<span class="ico" style="'+sw+'"></span><span class="lab"><div class="name" style="font-weight:400'+(muted?';color:'+cssvar('--sub'):'')+'">'+txt+'</div></span>'; lg.appendChild(r); };
  HUBS.forEach(h=>add('background:'+css(HUE[h]), h+' 最快'));
  add('background:'+css(HUE['難波'])+';border:2.5px solid '+cssvar('--ring'), '更大、白圈更粗 = 四枢纽全覆盖');
  add('background:'+cssvar('--sub'), '点越大 = 阈值内可达枢纽越多');
  add('background:'+cssvar('--dim')+';border-color:'+cssvar('--dimbd'), '阈值内不可达', 1);
  add('background:transparent;border:2px dashed '+cssvar('--acc'), '仅低频线可达 ⚡', 1);
}

fetch('data/reach.json').then(r=>r.json()).then(d=>{
  DATA=d; if(WALK && !WALK_K) prepWalkK(); buildLegend();
  const cnt={measured:0,anchored:0,borrowed:0}; let tot=0;
  for(const s of d.stations) for(const p of s.prov) if(p){cnt[p]++;tot++;}
  const pct=k=>tot? (100*cnt[k]/tot).toFixed(0) : 0;
  $('note').innerHTML = NOTE_HTML.replace('{M}',pct('measured')).replace('{A}',pct('anchored')).replace('{B}',pct('borrowed'));
  if(map.loaded()||map.getSource('stations')) render();
});

// 地図の任意地点を長押し/右クリック → その地点から四枢纽への時間（最寄り経由駅つき）。徒歩は駅と同じ実路網等時圏＋迂回係数で判定する
function pipRings(rings, lat, lon){ let inside = false;
  for(const r of rings){ for(let i=0, j=r.length-1; i<r.length; j=i++){ const yi=r[i][0], xi=r[i][1], yj=r[j][0], xj=r[j][1];
    if((yi>lat) !== (yj>lat) && lon < (xj-xi)*(lat-yi)/(yj-yi)+xi) inside = !inside; } }
  return inside; }
function pointQuery(ll){
  ensureWalk();
  const low = $('lowfreq').checked, th = +$('th').value;
  const cosL = Math.cos(ll.lat*Math.PI/180);
  const bestT = [null,null,null,null], bestVia = [null,null,null,null];
  for(const s of DATA.stations){
    const dm = Math.hypot((s.lat-ll.lat)*111320, (s.lon-ll.lng)*111320*cosL);
    if(dm > 1700) continue;
    const tsl = dm/WALK_M_PER_MIN; let walk = null;
    const polys = WALK && WALK[s.station_id];
    if(polys){ for(const m of [5,10,15,20]){ if(polys[m] && pipRings(polys[m], ll.lat, ll.lng)){ const k = (WALK_K && WALK_K[s.station_id] && WALK_K[s.station_id][m]) || 1.3; walk = Math.min(m, Math.max(m-5+0.01, tsl*k)); break; } }
      if(walk===null) continue; }
    else { if(tsl > 20) continue; walk = tsl; }
    const t = low ? s.t_low : s.t_default;
    for(let h=0;h<4;h++){ if(t[h]===null) continue; const v = t[h] + walk; if(bestT[h]===null || v < bestT[h]){ bestT[h]=v; bestVia[h]={name:s.name, walk:walk}; } }
  }
  const fg = cssvar('--popfg'), dim = cssvar('--popdim');
  let h = '<b>此地点的可达性</b>';
  if(bestT.every(v=>v===null)) h += '<div style="margin-top:4px;color:'+dim+'">步行20分内无可用车站</div>';
  else {
    h += '<table style="margin-top:5px;border-collapse:collapse">';
    HUBS.forEach((hub,i)=>{ const v = bestT[i], inTh = v!==null && v<=th;
      h += '<tr><td style="padding:1px 8px 1px 0"><span class="tsw" style="background:'+css(HUE[hub])+'"></span> '+hub+'</td>'
        + '<td style="padding:1px 8px 1px 0;color:'+(inTh?fg:dim)+';'+(inTh?'font-weight:700':'')+'">'+(v===null?'20分步行圈外':v.toFixed(0)+' 分')+'</td>'
        + '<td style="color:'+dim+';font-size:11px">'+(bestVia[i] ? '步行'+bestVia[i].walk.toFixed(0)+'分→'+bestVia[i].name : '')+'</td></tr>'; });
    h += '</table>';
    if(!WALK) h += '<div style="margin-top:4px;color:'+dim+';font-size:11px">路网等时圈载入中，本次为直线估算</div>';
  }
  return h;
}
// 钉子：長押し(モバイル)/右クリック(PC)。MapLibre 没有触摸长按事件，自己计时：按下 600ms 不动就算长按，之后 700ms 内的合成 click 忽略
const pinEl = () => { const d=document.createElement('div'); d.style.cssText='width:26px;height:34px;pointer-events:none';
  d.innerHTML='<svg width="26" height="34" viewBox="0 0 26 34"><path d="M13 1C6.4 1 1 6.4 1 13c0 8.5 12 20 12 20s12-11.5 12-20C25 6.4 19.6 1 13 1z" fill="#e5484d" stroke="#00000066" stroke-width="1.5"/><circle cx="13" cy="13" r="4.5" fill="#fff"/></svg>'; return d; };
let pin = null;
function dropPin(lngLat){
  if(!DATA) return; lastLongPress = Date.now();
  if(pin){ pin.remove(); pin=null; }
  pin = new maplibregl.Marker({element:pinEl(), anchor:'bottom'}).setLngLat(lngLat).addTo(map);
  openPopup(lngLat, pointQuery(lngLat), {offset:[0,-30], onClose:()=>{ if(pin){ pin.remove(); pin=null; } }});
}
map.on('contextmenu', e=>{ e.preventDefault(); dropPin(e.lngLat); });
{ const cv = map.getCanvasContainer(); let t=null, p0=null;
  cv.addEventListener('touchstart', e=>{ if(e.touches.length!==1) return; p0=[e.touches[0].clientX,e.touches[0].clientY];
    t=setTimeout(()=>{ t=null; const r=cv.getBoundingClientRect(); dropPin(map.unproject([p0[0]-r.left,p0[1]-r.top])); },600); }, {passive:true});
  cv.addEventListener('touchmove', e=>{ if(t && p0 && Math.hypot(e.touches[0].clientX-p0[0], e.touches[0].clientY-p0[1])>8){ clearTimeout(t); t=null; } }, {passive:true});
  const cancel=()=>{ if(t){ clearTimeout(t); t=null; } }; cv.addEventListener('touchend',cancel); cv.addEventListener('touchcancel',cancel); }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  HUE = PALETTE[THEME];
  document.querySelector('meta[name=theme-color]').setAttribute('content', THEME==='dark' ? '#0e0f12' : '#f7f7f9');
  setDark(THEME==='dark');
  if(map.getLayer('lines')){ map.setPaintProperty('lines','line-color',cssvar('--track')); map.setPaintProperty('lines','line-opacity',parseFloat(cssvar('--trackop'))); }
  drawHubs();
  if(DATA){ buildLegend(); render(); if(area.on) area.draw(); }
}
applyTheme();
function redrawAll(){ if(!DATA) return; render(); if(area.on) area.draw(); }
$('th').addEventListener('input',()=>{ $('thv').textContent = $('th').value+' 分'; redrawAll(); });
$('wk').addEventListener('input',()=>{ $('wkv').textContent = $('wk').value+' 分'; if(area.on) area.draw(); });
$('lowfreq').addEventListener('change',redrawAll);
$('areaOn').addEventListener('change',e=>{
  $('walkWrap').hidden = !e.target.checked;
  if(e.target.checked){ ensureWalk(); area.add(); } else { area.remove(); $('areastat').textContent = ''; }
  if(DATA) render();   // 势力范围モードの点表示は面の有無に連動する
});
// 居住等级面层：治安×环境的 S–D 分区（geometry 见 data/tiers.geojson 的 meta）。GL 图层在车站之下，车站照样能点
const TIER_COL={S:'#3fa57d',A:'#8fbf54',B:'#e3c24e',C:'#e08b45',D:'#d05252'};
const tcol=t=>TIER_COL[String(t).replace(/[+-]/,'')]||'#999';
let tiersLoading=null, tiersLoaded=false;
function ensureTiers(){
  if(tiersLoaded) return Promise.resolve();
  if(tiersLoading) return tiersLoading;
  tiersLoading=fetch('data/tiers.geojson').then(r=>r.json()).then(fc=>{
    fc.features.sort((a,b)=>(a.properties.kind==='muni'?0:1)-(b.properties.kind==='muni'?0:1));   // 整市粗块先画、细分块后画
    fc.features.forEach((f,i)=>{ f.id=i; f.properties.col=tcol(f.properties.tier); });
    map.getSource('tiers').setData(fc); tiersLoaded=true; TIERS=fc;
  });
  return tiersLoading;
}
let TIERS=null, hoverId=null;
function openTier(f,e){ const p=f.properties;
  openPopup(e.lngLat, `<div class="tierpop"><b>${p.name}</b><span class="t" style="background:${tcol(p.tier)}">${p.tier}</span>`+
    `<div style="color:var(--sub);font-size:11px;margin-top:3px">${p.kind==='zone'?p.parent+' · 细分块':'整市'}</div>`+(p.note?`<div style="margin-top:4px">${p.note}</div>`:'')+`</div>`); }
map.on('mousemove','tiers-fill',e=>{ const id=e.features[0].id; if(hoverId!==null && hoverId!==id) map.setFeatureState({source:'tiers',id:hoverId},{hover:false}); hoverId=id; map.setFeatureState({source:'tiers',id},{hover:true}); });
map.on('mouseleave','tiers-fill',()=>{ if(hoverId!==null) map.setFeatureState({source:'tiers',id:hoverId},{hover:false}); hoverId=null; });
$('tiersOn').addEventListener('change',e=>{
  $('tiersLg').hidden=!e.target.checked;
  const vis=v=>{ for(const id of ['tiers-fill','tiers-line']) if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',v); };
  if(e.target.checked) ensureTiers().then(()=>{ if($('tiersOn').checked) vis('visible'); }); else vis('none');
});
$('terr').addEventListener('change',()=>{ if(DATA) render(); if(area.on) area.draw(); });
map.on('zoomend', ()=>{ if(DATA) render(); });   // 縮尺が変わったら点の半径を引き直す
</script>
